<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#667eea">
    <title>لوحة الموظف - نظام الإجازات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Light Mode */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.08);
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --card-bg: #ffffff;
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #888888;
            --border-color: #2a2a4a;
            --input-bg: #0f3460;
            --shadow: rgba(0,0,0,0.3);
            --gradient-start: #0f3460;
            --gradient-end: #16213e;
            --card-bg: #16213e;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-toggle, .logout-btn, .change-password-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--gradient-start);
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
        }

        .request-card, .mission-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            background: var(--card-bg);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* تصميم متجاوب */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .header-right {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
    <div class="header-content">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="
                width: 45px;
                height: 45px;
                background: rgba(255,255,255,0.15);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                font-weight: bold;
                color: var(--accent-color, #c9a84c);
                border: 1.5px solid var(--accent-color, #c9a84c);
            ">MMC</div>
            <div>
                <div style="font-size: 16px; font-weight: bold;">MURTADA MAAZ</div>
                <div style="font-size: 11px; opacity: 0.9; color: var(--accent-color, #c9a84c);">CONSULTANCY</div>
            </div>
        </div>
        <div class="header-right">
            <span id="userName" style="font-size: 14px;"></span>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
            <button class="change-password-btn" onclick="openChangePasswordModal()">🔐 تغيير كلمة المرور</button>
            <button class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">الإجمالي السنوي</div>
                <div class="stat-value" id="totalDays">30</div>
                <div class="stat-label">يوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المستخدم</div>
                <div class="stat-value" id="usedDays">0</div>
                <div class="stat-label">يوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المتبقي</div>
                <div class="stat-value" id="remainingDays">30</div>
                <div class="stat-label">يوم</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('vacations')">📋 طلبات الإجازات</button>
            <button class="tab" onclick="switchTab('missions')">📋 المأموريات</button>
        </div>

        <!-- تبويب الإجازات -->
        <div id="vacationsTab" class="tab-content active">
            <div class="section">
                <h2 class="section-title">📝 تقديم طلب إجازة جديد</h2>
                <form id="requestForm">
                    <div class="form-row">
                        <div>
                            <label>نوع الإجازة</label>
                            <select id="leaveType" required>
                                <option value="">اختر نوع الإجازة</option>
                                <option value="سنوية">سنوية</option>
                                <option value="مرضية">مرضية</option>
                                <option value="طارئة">طارئة</option>
                            </select>
                        </div>
                        <div>
                            <label>تاريخ البدء</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div>
                            <label>عدد الأيام</label>
                            <input type="number" id="days" min="0.5" step="0.5" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">تقديم الطلب</button>
                </form>
            </div>

            <div class="section">
                <h2 class="section-title">📋 طلباتي السابقة</h2>
                <div id="requestsList"></div>
            </div>
        </div>

        <!-- تبويب المأموريات -->
        <div id="missionsTab" class="tab-content">
            <div class="section">
                <h2 class="section-title">📋 مأمورياتي</h2>
                <div id="missionsList"></div>
            </div>
        </div>
    </div>

    <!-- Modal تغيير كلمة المرور -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--text-primary); margin-bottom: 20px;">🔐 تغيير كلمة المرور</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>كلمة المرور الحالية</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور الجديدة</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">تغيير كلمة المرور</button>
                <button type="button" class="btn" onclick="closeChangePasswordModal()" style="width: 100%; margin-top: 10px; background: #dc3545;">إلغاء</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        let currentUser = null

        // ============ Dark Mode ============
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light'
            document.documentElement.setAttribute('data-theme', savedTheme)
            updateThemeIcon(savedTheme)
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme')
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark'
            document.documentElement.setAttribute('data-theme', newTheme)
            localStorage.setItem('theme', newTheme)
            updateThemeIcon(newTheme)
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeToggle')
            icon.textContent = theme === 'dark' ? '☀️' : '🌙'
            document.querySelector('meta[name="theme-color"]').content = 
                theme === 'dark' ? '#16213e' : '#667eea'
        }

        window.toggleTheme = toggleTheme
        initTheme()

        // ============ التحقق من الصلاحية ============
        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser')
            if (!savedUser) {
                window.location.href = 'index.html'
                return
            }
            currentUser = JSON.parse(savedUser)
            if (currentUser.role === 'admin') {
                window.location.href = 'admin.html'
                return
            }
            document.getElementById('userName').textContent = `👤 ${currentUser.name}`
            updateStats()
            loadMyRequests()
            loadMyMissions()
        }

        async function updateStats() {
            const { data } = await supabase
                .from('employees')
                .select('total_annual, used')
                .eq('id', currentUser.id)
                .single()
            
            if (data) {
                currentUser.total_annual = data.total_annual
                currentUser.used = data.used
                localStorage.setItem('currentUser', JSON.stringify(currentUser))
            }
            
            const total = currentUser.total_annual || 30
            const used = currentUser.used || 0
            const remaining = total - used
            
            document.getElementById('totalDays').textContent = total
            document.getElementById('usedDays').textContent = used
            document.getElementById('remainingDays').textContent = remaining
            
            const remainingEl = document.getElementById('remainingDays')
            remainingEl.style.color = remaining < 5 ? '#dc3545' : 'var(--gradient-start)'
        }

        // ============ طلبات الإجازات ============
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const type = document.getElementById('leaveType').value
            const startDate = document.getElementById('startDate').value
            const days = parseFloat(document.getElementById('days').value)
            
            const remaining = (currentUser.total_annual || 30) - (currentUser.used || 0)
            if (days > remaining) {
                alert(`⚠️ رصيدك المتبقي (${remaining}) يوم فقط`)
                return
            }
            
            const { error } = await supabase
                .from('requests')
                .insert([{
                    employee_id: currentUser.id,
                    type, start_date: startDate, days,
                    status: 'pending'
                }])
            
            if (error) {
                alert('❌ فشل تقديم الطلب: ' + error.message)
            } else {
                alert('✅ تم تقديم الطلب بنجاح')
                document.getElementById('requestForm').reset()
                loadMyRequests()
            }
        })

        async function loadMyRequests() {
            const { data } = await supabase
                .from('requests')
                .select('*')
                .eq('employee_id', currentUser.id)
                .order('created_at', { ascending: false })
            
            const container = document.getElementById('requestsList')
            const requests = data || []
            
            if (requests.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">📭 لا توجد طلبات</div>'
                return
            }
            
            container.innerHTML = requests.map(req => {
                const statusText = {
                    'pending': '⏳ قيد الانتظار',
                    'approved': '✅ مقبول',
                    'rejected': '❌ مرفوض'
                }[req.status] || req.status
                
                return `
                    <div class="request-card">
                        <div class="request-header">
                            <strong style="color: var(--text-primary);">${req.type}</strong>
                            <span class="status status-${req.status}">${statusText}</span>
                        </div>
                        <div style="color: var(--text-secondary);">📅 تاريخ البدء: ${req.start_date}</div>
                        <div style="color: var(--text-secondary);">⏱️ عدد الأيام: ${req.days} يوم</div>
                        <div style="color: var(--text-muted); font-size: 12px; margin-top: 10px;">
                            🕐 ${new Date(req.created_at).toLocaleDateString('ar-SA')}
                        </div>
                    </div>
                `
            }).join('')
        }

        // ============ المأموريات ============
        async function loadMyMissions() {
            const { data } = await supabase
                .from('missions')
                .select('*')
                .eq('employee_id', currentUser.id)
                .order('created_at', { ascending: false })
            
            const container = document.getElementById('missionsList')
            const missions = data || []
            
            if (missions.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">📭 لا توجد مأموريات</div>'
                return
            }
            
            container.innerHTML = missions.map(m => {
                return `
                    <div class="mission-card">
                        <div class="request-header">
                            <strong style="color: var(--text-primary);">${m.type}</strong>
                            <span class="status status-approved">${m.status === 'active' ? '✅ نشطة' : '✅ مكتملة'}</span>
                        </div>
                        <div style="color: var(--text-secondary);">📅 من: ${m.start_date}</div>
                        <div style="color: var(--text-secondary);">📅 إلى: ${m.end_date}</div>
                        ${m.description ? `<div style="color: var(--text-muted); margin-top: 10px;">📝 ${m.description}</div>` : ''}
                    </div>
                `
            }).join('')
        }

        // ============ تغيير كلمة المرور ============
        window.openChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'flex'
        }

        window.closeChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'none'
            document.getElementById('changePasswordForm').reset()
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const currentPass = document.getElementById('currentPassword').value
            const newPass = document.getElementById('newPassword').value
            const confirmPass = document.getElementById('confirmPassword').value
            
            if (currentPass !== currentUser.password) {
                alert('❌ كلمة المرور الحالية غير صحيحة')
                return
            }
            
            if (newPass !== confirmPass) {
                alert('❌ كلمة المرور الجديدة غير متطابقة')
                return
            }
            
            if (newPass.length < 3) {
                alert('❌ كلمة المرور يجب أن تكون 3 أحرف على الأقل')
                return
            }
            
            await supabase.from('employees').update({ password: newPass }).eq('id', currentUser.id)
            
            currentUser.password = newPass
            localStorage.setItem('currentUser', JSON.stringify(currentUser))
            
            alert('✅ تم تغيير كلمة المرور بنجاح')
            closeChangePasswordModal()
        })

        // ============ التبويبات ============
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            event.target.classList.add('active')
            
            document.getElementById('vacationsTab').classList.toggle('active', tabName === 'vacations')
            document.getElementById('missionsTab').classList.toggle('active', tabName === 'missions')
        }

        // ============ تسجيل الخروج ============
        window.logout = () => {
            localStorage.removeItem('currentUser')
            window.location.href = 'index.html'
        }

        checkAuth()
    </script>
</body>
</html>

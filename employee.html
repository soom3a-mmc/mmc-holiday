<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الموظف - نظام الإجازات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn, .change-password-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .request-card, .mission-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .remaining-badge {
            background: #d4edda;
            color: #155724;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .remaining-low {
            background: #f8d7da;
            color: #721c24;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: white;
            padding: 10px;
            border-radius: 15px;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🏢 نظام إدارة الإجازات</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="userName"></span>
                <button class="change-password-btn" onclick="openChangePasswordModal()">🔐 تغيير كلمة المرور</button>
                <button class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">الإجمالي السنوي</div>
                <div class="stat-value" id="totalDays">30</div>
                <div class="stat-label">يوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المستخدم</div>
                <div class="stat-value" id="usedDays">0</div>
                <div class="stat-label">يوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المتبقي</div>
                <div class="stat-value" id="remainingDays">30</div>
                <div class="stat-label">يوم</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('vacations')">📋 طلبات الإجازات</button>
            <button class="tab" onclick="switchTab('missions')">📋 المأموريات</button>
        </div>

        <!-- تبويب الإجازات -->
        <div id="vacationsTab" class="tab-content active">
            <div class="section">
                <h2 class="section-title">📝 تقديم طلب إجازة جديد</h2>
                <form id="requestForm">
                    <div class="form-row">
                        <div>
                            <label>نوع الإجازة</label>
                            <select id="leaveType" required>
                                <option value="">اختر نوع الإجازة</option>
                                <option value="سنوية">سنوية</option>
                                <option value="مرضية">مرضية</option>
                                <option value="طارئة">طارئة</option>
                            </select>
                        </div>
                        <div>
                            <label>تاريخ البدء</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div>
                            <label>عدد الأيام</label>
                            <input type="number" id="days" min="0.5" step="0.5" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">تقديم الطلب</button>
                </form>
            </div>

            <div class="section">
                <h2 class="section-title">📋 طلباتي السابقة</h2>
                <div id="requestsList"></div>
            </div>
        </div>

        <!-- تبويب المأموريات -->
        <div id="missionsTab" class="tab-content">
            <div class="section">
                <h2 class="section-title">📋 مأمورياتي</h2>
                <div id="missionsList"></div>
            </div>
        </div>
    </div>

    <!-- Modal تغيير كلمة المرور -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <h2>🔐 تغيير كلمة المرور</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>كلمة المرور الحالية</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور الجديدة</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn">تغيير كلمة المرور</button>
                <button type="button" class="btn" style="background: #dc3545;" onclick="closeChangePasswordModal()">إلغاء</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        let currentUser = null

        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser')
            if (!savedUser) {
                window.location.href = 'index.html'
                return
            }
            currentUser = JSON.parse(savedUser)
            if (currentUser.role === 'admin') {
                window.location.href = 'admin.html'
                return
            }
            document.getElementById('userName').textContent = `👤 ${currentUser.name}`
            updateStats()
            loadMyRequests()
            loadMyMissions()
        }

        async function updateStats() {
            // جلب أحدث بيانات الموظف
            const { data } = await supabase
                .from('employees')
                .select('total_annual, used')
                .eq('id', currentUser.id)
                .single()
            
            if (data) {
                currentUser.total_annual = data.total_annual
                currentUser.used = data.used
                localStorage.setItem('currentUser', JSON.stringify(currentUser))
            }
            
            const total = currentUser.total_annual || 30
            const used = currentUser.used || 0
            const remaining = total - used
            
            document.getElementById('totalDays').textContent = total
            document.getElementById('usedDays').textContent = used
            document.getElementById('remainingDays').textContent = remaining
            
            // تغيير لون المتبقي إذا كان منخفضاً
            const remainingEl = document.getElementById('remainingDays')
            if (remaining < 5) {
                remainingEl.style.color = '#dc3545'
            } else {
                remainingEl.style.color = '#667eea'
            }
        }

        // ============ طلبات الإجازات ============
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const type = document.getElementById('leaveType').value
            const startDate = document.getElementById('startDate').value
            const days = parseFloat(document.getElementById('days').value)
            
            const remaining = (currentUser.total_annual || 30) - (currentUser.used || 0)
            if (days > remaining) {
                alert(`⚠️ رصيدك المتبقي (${remaining}) يوم فقط`)
                return
            }
            
            const { error } = await supabase
                .from('requests')
                .insert([{
                    employee_id: currentUser.id,
                    type, start_date: startDate, days,
                    status: 'pending'
                }])
            
            if (error) {
                alert('❌ فشل تقديم الطلب: ' + error.message)
            } else {
                alert('✅ تم تقديم الطلب بنجاح')
                document.getElementById('requestForm').reset()
                loadMyRequests()
            }
        })

        async function loadMyRequests() {
            const { data } = await supabase
                .from('requests')
                .select('*')
                .eq('employee_id', currentUser.id)
                .order('created_at', { ascending: false })
            
            const container = document.getElementById('requestsList')
            const requests = data || []
            
            if (requests.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">📭 لا توجد طلبات</div>'
                return
            }
            
            container.innerHTML = requests.map(req => {
                const statusText = {
                    'pending': '⏳ قيد الانتظار',
                    'approved': '✅ مقبول',
                    'rejected': '❌ مرفوض'
                }[req.status] || req.status
                
                return `
                    <div class="request-card">
                        <div class="request-header">
                            <strong>${req.type}</strong>
                            <span class="status status-${req.status}">${statusText}</span>
                        </div>
                        <div>📅 تاريخ البدء: ${req.start_date}</div>
                        <div>⏱️ عدد الأيام: ${req.days} يوم</div>
                        <div>🕐 تاريخ التقديم: ${new Date(req.created_at).toLocaleDateString('ar-SA')}</div>
                    </div>
                `
            }).join('')
        }

        // ============ المأموريات ============
        async function loadMyMissions() {
            const { data } = await supabase
                .from('missions')
                .select('*')
                .eq('employee_id', currentUser.id)
                .order('created_at', { ascending: false })
            
            const container = document.getElementById('missionsList')
            const missions = data || []
            
            if (missions.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">📭 لا توجد مأموريات</div>'
                return
            }
            
            container.innerHTML = missions.map(m => {
                const start = new Date(m.start_date)
                const end = new Date(m.end_date)
                const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1
                
                return `
                    <div class="mission-card">
                        <div class="request-header">
                            <strong>${m.type}</strong>
                            <span class="status status-approved">${m.status === 'active' ? '✅ نشطة' : '✅ مكتملة'}</span>
                        </div>
                        <div>📅 من: ${m.start_date}</div>
                        <div>📅 إلى: ${m.end_date}</div>
                        <div>⏱️ المدة: ${days} يوم</div>
                        ${m.description ? `<div>📝 ${m.description}</div>` : ''}
                    </div>
                `
            }).join('')
        }

        // ============ تغيير كلمة المرور ============
        window.openChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'flex'
        }

        window.closeChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'none'
            document.getElementById('changePasswordForm').reset()
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const currentPass = document.getElementById('currentPassword').value
            const newPass = document.getElementById('newPassword').value
            const confirmPass = document.getElementById('confirmPassword').value
            
            if (currentPass !== currentUser.password) {
                alert('❌ كلمة المرور الحالية غير صحيحة')
                return
            }
            
            if (newPass !== confirmPass) {
                alert('❌ كلمة المرور الجديدة غير متطابقة')
                return
            }
            
            if (newPass.length < 3) {
                alert('❌ كلمة المرور يجب أن تكون 3 أحرف على الأقل')
                return
            }
            
            await supabase.from('employees').update({ password: newPass }).eq('id', currentUser.id)
            
            currentUser.password = newPass
            localStorage.setItem('currentUser', JSON.stringify(currentUser))
            
            alert('✅ تم تغيير كلمة المرور بنجاح')
            closeChangePasswordModal()
        })

        // ============ التبويبات ============
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            event.target.classList.add('active')
            
            document.getElementById('vacationsTab').classList.toggle('active', tabName === 'vacations')
            document.getElementById('missionsTab').classList.toggle('active', tabName === 'missions')
        }

        // ============ تسجيل الخروج ============
        window.logout = () => {
            localStorage.removeItem('currentUser')
            window.location.href = 'index.html'
        }

        checkAuth()
    </script>
</body>
</html>

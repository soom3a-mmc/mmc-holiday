<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الموظف - الإجازات والمأموريات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-icon {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .request-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .badge {
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 5px;
        }

        .badge-leave { background: #e3f2fd; color: #1976d2; }
        .badge-mission { background: #f3e5f5; color: #7b1fa2; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🏢 نظام الإجازات والمأموريات</h1>
            <div class="user-menu">
                <span id="userName"></span>
                <button class="btn-icon" onclick="openChangePasswordModal()">🔐 تغيير كلمة المرور</button>
                <button class="btn-icon" onclick="logout()">🚪 تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">الإجمالي السنوي</div>
                <div class="stat-value" id="totalDays">30</div>
                <div class="stat-label">يوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المستخدم</div>
                <div class="stat-value" id="usedDays">0</div>
                <div class="stat-label">يوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">✨ المتبقي</div>
                <div class="stat-value" id="remainingDays">30</div>
                <div class="stat-label">يوم</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('leave')">📋 طلب إجازة</button>
            <button class="tab-btn" onclick="showTab('mission')">🎯 طلب مأمورية</button>
            <button class="tab-btn" onclick="showTab('history')">📜 سجل الطلبات</button>
        </div>

        <!-- طلب إجازة -->
        <div id="leaveSection" class="section active">
            <h2 class="section-title">📝 تقديم طلب إجازة جديد</h2>
            <form id="leaveForm">
                <div class="form-row">
                    <div>
                        <label>نوع الإجازة</label>
                        <select id="leaveType" required>
                            <option value="">اختر النوع</option>
                            <option value="سنوية">سنوية</option>
                            <option value="مرضية">مرضية</option>
                            <option value="طارئة">طارئة</option>
                            <option value="بدون راتب">بدون راتب</option>
                        </select>
                    </div>
                    <div>
                        <label>تاريخ البدء</label>
                        <input type="date" id="leaveStartDate" required>
                    </div>
                    <div>
                        <label>عدد الأيام</label>
                        <input type="number" id="leaveDays" min="0.5" step="0.5" required>
                    </div>
                </div>
                <button type="submit" class="btn">تقديم طلب الإجازة</button>
            </form>
        </div>

        <!-- طلب مأمورية -->
        <div id="missionSection" class="section">
            <h2 class="section-title">🎯 تقديم طلب مأمورية جديد</h2>
            <form id="missionForm">
                <div class="form-row">
                    <div>
                        <label>نوع المأمورية</label>
                        <select id="missionType" required>
                            <option value="">اختر النوع</option>
                            <option value="داخلية">داخلية</option>
                            <option value="خارجية">خارجية</option>
                            <option value="تدريب">تدريب</option>
                            <option value="مؤتمر">مؤتمر</option>
                        </select>
                    </div>
                    <div>
                        <label>تاريخ البدء</label>
                        <input type="date" id="missionStartDate" required>
                    </div>
                    <div>
                        <label>تاريخ الانتهاء</label>
                        <input type="date" id="missionEndDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>الوجهة</label>
                        <input type="text" id="missionDestination" placeholder="مكان المأمورية" required>
                    </div>
                    <div>
                        <label>الغرض</label>
                        <input type="text" id="missionPurpose" placeholder="الغرض من المأمورية" required>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>ملاحظات</label>
                        <textarea id="missionNotes" rows="3" placeholder="ملاحظات إضافية"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn">تقديم طلب المأمورية</button>
            </form>
        </div>

        <!-- سجل الطلبات -->
        <div id="historySection" class="section">
            <h2 class="section-title">📜 سجل الطلبات</h2>
            <div id="requestsHistory"></div>
        </div>
    </div>

    <!-- Modal تغيير كلمة المرور -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">🔐 تغيير كلمة المرور</h2>
            <form id="changePasswordForm">
                <div style="margin-bottom: 15px;">
                    <label>كلمة المرور الحالية</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required minlength="3">
                </div>
                <div style="margin-bottom: 20px;">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn">تغيير كلمة المرور</button>
                <button type="button" class="btn" style="background: #6c757d; margin-top: 10px;" onclick="closeChangePasswordModal()">إلغاء</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        let currentUser = null

        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser')
            if (!savedUser) {
                window.location.href = 'index.html'
                return
            }
            currentUser = JSON.parse(savedUser)
            if (currentUser.role === 'admin') {
                window.location.href = 'admin.html'
                return
            }
            document.getElementById('userName').textContent = `👤 ${currentUser.name}`
            updateStats()
            loadHistory()
        }

        function updateStats() {
            const total = currentUser.total_annual || 30
            const used = currentUser.used || 0
            document.getElementById('totalDays').textContent = total
            document.getElementById('usedDays').textContent = used
            document.getElementById('remainingDays').textContent = total - used
        }

        window.showTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'))
            event.target.classList.add('active')
            
            document.getElementById('leaveSection').classList.remove('active')
            document.getElementById('missionSection').classList.remove('active')
            document.getElementById('historySection').classList.remove('active')
            
            if (tab === 'leave') {
                document.getElementById('leaveSection').classList.add('active')
            } else if (tab === 'mission') {
                document.getElementById('missionSection').classList.add('active')
            } else {
                document.getElementById('historySection').classList.add('active')
                loadHistory()
            }
        }

        // تقديم طلب إجازة
        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const type = document.getElementById('leaveType').value
            const startDate = document.getElementById('leaveStartDate').value
            const days = parseFloat(document.getElementById('leaveDays').value)
            
            const remaining = currentUser.total_annual - currentUser.used
            if (days > remaining) {
                alert(`⚠️ رصيدك المتبقي (${remaining}) يوم فقط`)
                return
            }
            
            try {
                await supabase.from('requests').insert([{
                    employee_id: currentUser.id,
                    request_type: 'leave',
                    type, start_date: startDate, days,
                    status: 'pending'
                }])
                
                alert('✅ تم تقديم طلب الإجازة بنجاح')
                document.getElementById('leaveForm').reset()
            } catch (error) {
                alert('❌ فشل تقديم الطلب: ' + error.message)
            }
        })

        // تقديم طلب مأمورية
        document.getElementById('missionForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            try {
                await supabase.from('requests').insert([{
                    employee_id: currentUser.id,
                    request_type: 'mission',
                    type: document.getElementById('missionType').value,
                    start_date: document.getElementById('missionStartDate').value,
                    end_date: document.getElementById('missionEndDate').value,
                    destination: document.getElementById('missionDestination').value,
                    purpose: document.getElementById('missionPurpose').value,
                    notes: document.getElementById('missionNotes').value,
                    status: 'pending'
                }])
                
                alert('✅ تم تقديم طلب المأمورية بنجاح')
                document.getElementById('missionForm').reset()
            } catch (error) {
                alert('❌ فشل تقديم الطلب: ' + error.message)
            }
        })

        async function loadHistory() {
            const { data } = await supabase
                .from('requests')
                .select('*')
                .eq('employee_id', currentUser.id)
                .order('created_at', { ascending: false })
            
            const container = document.getElementById('requestsHistory')
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">📭 لا توجد طلبات</div>'
                return
            }
            
            container.innerHTML = data.map(req => {
                const isLeave = req.request_type === 'leave'
                const statusText = {
                    'pending': '⏳ قيد الانتظار',
                    'approved': '✅ مقبول',
                    'rejected': '❌ مرفوض'
                }[req.status] || req.status
                
                return `
                    <div class="request-card">
                        <div class="request-header">
                            <div>
                                <span class="badge ${isLeave ? 'badge-leave' : 'badge-mission'}">
                                    ${isLeave ? 'إجازة' : 'مأمورية'}
                                </span>
                                <strong>${req.type}</strong>
                            </div>
                            <span class="status status-${req.status}">${statusText}</span>
                        </div>
                        <div>📅 من: ${req.start_date} ${req.end_date ? `إلى: ${req.end_date}` : ''}</div>
                        ${isLeave ? `<div>⏱️ عدد الأيام: ${req.days} يوم</div>` : ''}
                        ${!isLeave && req.destination ? `<div>📍 الوجهة: ${req.destination}</div>` : ''}
                        ${!isLeave && req.purpose ? `<div>🎯 الغرض: ${req.purpose}</div>` : ''}
                    </div>
                `
            }).join('')
        }

        // تغيير كلمة المرور
        window.openChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'flex'
        }
        
        window.closeChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'none'
            document.getElementById('changePasswordForm').reset()
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const currentPass = document.getElementById('currentPassword').value
            const newPass = document.getElementById('newPassword').value
            const confirmPass = document.getElementById('confirmPassword').value
            
            if (currentPass !== currentUser.password) {
                alert('❌ كلمة المرور الحالية غير صحيحة')
                return
            }
            
            if (newPass !== confirmPass) {
                alert('❌ كلمة المرور الجديدة غير متطابقة')
                return
            }
            
            if (newPass.length < 3) {
                alert('❌ كلمة المرور يجب أن تكون 3 أحرف على الأقل')
                return
            }
            
            try {
                await supabase.from('employees')
                    .update({ password: newPass })
                    .eq('id', currentUser.id)
                
                currentUser.password = newPass
                localStorage.setItem('currentUser', JSON.stringify(currentUser))
                
                alert('✅ تم تغيير كلمة المرور بنجاح')
                closeChangePasswordModal()
            } catch (error) {
                alert('❌ فشل تغيير كلمة المرور')
            }
        })

        window.logout = () => {
            localStorage.removeItem('currentUser')
            window.location.href = 'index.html'
        }

        checkAuth()
    </script>
</body>
</html>

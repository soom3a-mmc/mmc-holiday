<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإجازات - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 50px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
        }

        .demo-credentials {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏢</div>
        <h1>نظام الإجازات</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">👤 اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label for="password">🔒 كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            
            <button type="submit">تسجيل الدخول</button>
        </form>
        
        <div class="loading" id="loading">جاري تسجيل الدخول...</div>
        <div class="error-message" id="errorMessage"></div>
        
        <div class="demo-credentials">
            <p><strong>بيانات تجريبية:</strong></p>
            <p>👨‍💼 مدير: admin / 123</p>
            <p>👨‍💻 موظف: ahmed / 123</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        const loginForm = document.getElementById('loginForm')
        const errorMessage = document.getElementById('errorMessage')
        const loading = document.getElementById('loading')

        // التحقق من وجود جلسة سابقة
        const savedUser = localStorage.getItem('currentUser')
        if (savedUser) {
            try {
                const user = JSON.parse(savedUser)
                if (user.role === 'admin') {
                    window.location.href = 'admin.html'
                } else {
                    window.location.href = 'employee.html'
                }
            } catch (e) {
                localStorage.removeItem('currentUser')
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            
            loading.style.display = 'block'
            errorMessage.style.display = 'none'
            
            try {
                const { data, error } = await supabase
                    .from('employees')
                    .select('*')
                    .eq('name', username)
                    .eq('password', password)
                    .single()
                
                if (error || !data) {
                    throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة')
                }
                
                localStorage.setItem('currentUser', JSON.stringify(data))
                
                if (data.role === 'admin') {
                    window.location.href = 'admin.html'
                } else {
                    window.location.href = 'employee.html'
                }
                
            } catch (error) {
                errorMessage.textContent = error.message
                errorMessage.style.display = 'block'
                loading.style.display = 'none'
            }
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإجازات - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 15px;
            display: none;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 نظام الإجازات</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label>👤 اسم المستخدم</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="password" required>
            </div>
            
            <button type="submit">تسجيل الدخول</button>
        </form>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="info">
            <p><strong>بيانات الدخول:</strong></p>
            <p>مدير: admin / 123</p>
            <p>موظف: ahmed / 123</p>
        </div>
    </div>

    <!-- استخدام Supabase بالطريقة القديمة (أكثر توافقاً) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // انتظر تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            console.log('الصفحة جاهزة');
            
            // إنشاء اتصال Supabase
            const supabase = window.supabase.createClient(
                'https://ueszjhtztdlqaduogzog.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
            );
            
            console.log('Supabase جاهز');
            
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                console.log('محاولة تسجيل الدخول:', username);
                errorMessage.style.display = 'none';
                
                try {
                    const { data, error } = await supabase
                        .from('employees')
                        .select('*')
                        .eq('name', username)
                        .eq('password', password)
                        .single();
                    
                    if (error) {
                        console.error('خطأ:', error);
                        throw new Error('بيانات الدخول غير صحيحة');
                    }
                    
                    if (data) {
                        console.log('تم تسجيل الدخول:', data);
                        localStorage.setItem('currentUser', JSON.stringify(data));
                        
                        if (data.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }
                    
                } catch (err) {
                    console.error('فشل:', err);
                    errorMessage.textContent = err.message;
                    errorMessage.style.display = 'block';
                }
            });
            
            // التحقق من جلسة سابقة
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    if (user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'employee.html';
                    }
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#667eea">
    <title>نظام الإجازات - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Light Mode (افتراضي) */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.1);
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --card-bg: #ffffff;
            --demo-bg: #f8f9fa;
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #888888;
            --border-color: #2a2a4a;
            --input-bg: #0f3460;
            --shadow: rgba(0,0,0,0.3);
            --gradient-start: #0f3460;
            --gradient-end: #16213e;
            --card-bg: #16213e;
            --demo-bg: #0f3460;
        }

        body {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-size: clamp(24px, 5vw, 28px);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: clamp(40px, 10vw, 50px);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--card-bg);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 15px var(--shadow);
            color: var(--text-primary);
            z-index: 1000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        input:focus {
            outline: none;
            border-color: var(--gradient-start);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: clamp(16px, 4vw, 18px);
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--shadow);
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--gradient-start);
        }

        .demo-credentials {
            margin-top: 20px;
            padding: 15px;
            background: var(--demo-bg);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
        }

        /* تصميم متجاوب للموبايل */
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 70px;
            }

            .container {
                padding: 25px 20px;
            }

            .theme-toggle {
                top: 10px;
                left: 10px;
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }

        @media (max-width: 350px) {
            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>

    <div class="container">
        <div class="logo">🏢</div>
        <h1>نظام الإجازات</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">👤 اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label for="password">🔒 كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            
            <button type="submit">تسجيل الدخول</button>
        </form>
        
        <div class="loading" id="loading">جاري تسجيل الدخول...</div>
        <div class="error-message" id="errorMessage"></div>
        
        <div class="demo-credentials">
            <p><strong>بيانات تجريبية:</strong></p>
            <p>👨‍💼 مدير: admin / 123</p>
            <p>👨‍💻 موظف: ahmed / 123</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        // ============ Dark Mode ============
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light'
            document.documentElement.setAttribute('data-theme', savedTheme)
            updateThemeIcon(savedTheme)
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme')
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark'
            document.documentElement.setAttribute('data-theme', newTheme)
            localStorage.setItem('theme', newTheme)
            updateThemeIcon(newTheme)
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeToggle')
            icon.textContent = theme === 'dark' ? '☀️' : '🌙'
            document.querySelector('meta[name="theme-color"]').content = 
                theme === 'dark' ? '#16213e' : '#667eea'
        }

        window.toggleTheme = toggleTheme
        initTheme()

        // ============ تسجيل الدخول ============
        const loginForm = document.getElementById('loginForm')
        const errorMessage = document.getElementById('errorMessage')
        const loading = document.getElementById('loading')

        const savedUser = localStorage.getItem('currentUser')
        if (savedUser) {
            try {
                const user = JSON.parse(savedUser)
                if (user.role === 'admin') {
                    window.location.href = 'admin.html'
                } else {
                    window.location.href = 'employee.html'
                }
            } catch (e) {
                localStorage.removeItem('currentUser')
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            
            loading.style.display = 'block'
            errorMessage.style.display = 'none'
            
            try {
                const { data, error } = await supabase
                    .from('employees')
                    .select('*')
                    .eq('name', username)
                    .eq('password', password)
                    .single()
                
                if (error || !data) {
                    throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة')
                }
                
                localStorage.setItem('currentUser', JSON.stringify(data))
                
                if (data.role === 'admin') {
                    window.location.href = 'admin.html'
                } else {
                    window.location.href = 'employee.html'
                }
                
            } catch (error) {
                errorMessage.textContent = error.message
                errorMessage.style.display = 'block'
                loading.style.display = 'none'
            }
        })
    </script>
</body>
</html>

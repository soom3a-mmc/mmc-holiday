<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMC | نظام الإجازات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #eef2f9; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 30px; padding: 20px; }
        h1 { color: #1a2c3e; margin-bottom: 20px; }
        button { background: #2c7da0; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; margin: 5px; }
        input, select { padding: 10px; border-radius: 25px; border: 1px solid #ccc; margin: 5px; width: 200px; }
        .error { color: red; padding: 10px; background: #ffe0e0; border-radius: 10px; margin: 10px 0; }
        .success { color: green; padding: 10px; background: #e0ffe0; border-radius: 10px; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1><i class="fas fa-building"></i> MMC | نظام إدارة الإجازات</h1>
    <div id="statusBox" class="success">✅ جاري تحميل النظام...</div>
    
    <div id="loginSection">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button id="loginBtn">دخول</button>
        <p style="margin-top: 15px; font-size: 12px; color: #666;">مدير: admin / admin123 | موظف: أحمد حسن / 123</p>
    </div>
    
    <div id="adminSection" style="display:none;">
        <h2>لوحة المدير</h2>
        <div>
            <h3>إضافة موظف</h3>
            <input type="text" id="empName" placeholder="اسم الموظف">
            <input type="text" id="empPass" placeholder="كلمة المرور" value="123">
            <button id="addEmpBtn">➕ إضافة</button>
        </div>
        <div id="empList"></div>
    </div>
    
    <div id="empSection" style="display:none;">
        <h2>بوابة الموظف</h2>
        <div id="empWelcome"></div>
        <div>
            <h3>تقديم طلب إجازة</h3>
            <select id="leaveType"><option value="سنوية">سنوية</option><option value="مرضية">مرضية</option></select>
            <input type="date" id="startDate">
            <input type="number" id="daysCount" value="1">
            <button id="submitLeaveBtn">📝 إرسال الطلب</button>
        </div>
        <div id="myRequests"></div>
    </div>
</div>

<script type="module">
    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCUPrHkAzuRIQYQ8tHOmAUNZIRWaLarsQI",
        authDomain: "mmc-holidya.firebaseapp.com",
        projectId: "mmc-holidya",
        storageBucket: "mmc-holidya.firebasestorage.app",
        messagingSenderId: "552961282271",
        appId: "1:552961282271:web:a2f4518a9871b8c0ed196a"
    };
    
    let app, db;
    let currentUser = null;
    let employees = {};
    let requests = [];
    
    // تهيئة Firebase
    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        document.getElementById('statusBox').innerHTML = '✅ Firebase connected successfully!';
        document.getElementById('statusBox').className = 'success';
    } catch(e) {
        document.getElementById('statusBox').innerHTML = '❌ Firebase Error: ' + e.message;
        document.getElementById('statusBox').className = 'error';
        console.error(e);
    }
    
    // تحميل الموظفين
    async function loadEmployees() {
        try {
            employees = {};
            const snapshot = await getDocs(collection(db, "employees"));
            snapshot.forEach(doc => {
                let data = doc.data();
                employees[data.name] = { id: doc.id, ...data };
            });
            console.log("تم تحميل الموظفين:", employees);
            return true;
        } catch(e) {
            console.error("خطأ في تحميل الموظفين:", e);
            return false;
        }
    }
    
    // تحميل الطلبات
    async function loadRequests() {
        try {
            requests = [];
            const snapshot = await getDocs(collection(db, "requests"));
            snapshot.forEach(doc => {
                requests.push({ id: doc.id, ...doc.data() });
            });
            console.log("تم تحميل الطلبات:", requests.length);
            return true;
        } catch(e) {
            console.error("خطأ في تحميل الطلبات:", e);
            return false;
        }
    }
    
    // إضافة موظف
    async function addEmployee() {
        let name = document.getElementById('empName').value.trim();
        let pass = document.getElementById('empPass').value.trim();
        if(!name) { alert("أدخل اسم الموظف"); return; }
        
        try {
            await addDoc(collection(db, "employees"), {
                name: name,
                password: pass || "123",
                totalAnnual: 30,
                used: 0
            });
            await loadEmployees();
            document.getElementById('empName').value = '';
            alert(`✅ تم إضافة ${name}`);
            showAdminPanel();
        } catch(e) {
            alert("خطأ: " + e.message);
        }
    }
    
    // تقديم طلب
    async function submitRequest() {
        if(!currentUser || currentUser.role !== 'employee') return;
        
        let type = document.getElementById('leaveType').value;
        let startDate = document.getElementById('startDate').value;
        let days = parseInt(document.getElementById('daysCount').value);
        
        if(!startDate) { alert("حدد تاريخ"); return; }
        
        try {
            await addDoc(collection(db, "requests"), {
                employee: currentUser.name,
                type: type,
                startDate: startDate,
                days: days,
                status: "pending"
            });
            await loadRequests();
            alert("✅ تم إرسال طلبك");
            showEmployeePanel();
        } catch(e) {
            alert("خطأ: " + e.message);
        }
    }
    
    // عرض طلبات الموظف
    function showEmployeeRequests() {
        let myReqs = requests.filter(r => r.employee === currentUser.name);
        let html = '<h3>طلباتي:</h3>';
        if(myReqs.length === 0) html += '<p>لا توجد طلبات</p>';
        else {
            myReqs.forEach(r => {
                let status = r.status === 'pending' ? '⏳ قيد الانتظار' : (r.status === 'approved' ? '✅ موافق' : '❌ مرفوض');
                html += `<div>${r.type} | ${r.startDate} (${r.days} يوم) - ${status}</div>`;
            });
        }
        document.getElementById('myRequests').innerHTML = html;
    }
    
    // عرض لوحة المدير
    function showAdminPanel() {
        document.getElementById('adminSection').style.display = 'block';
        document.getElementById('empSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'none';
        
        let empHtml = '<h3>قائمة الموظفين:</h3>';
        for(let name in employees) {
            empHtml += `<div>${name} - رصيد: ${(employees[name].totalAnnual - (employees[name].used||0))}/30</div>`;
        }
        document.getElementById('empList').innerHTML = empHtml;
    }
    
    // عرض لوحة الموظف
    function showEmployeePanel() {
        document.getElementById('adminSection').style.display = 'none';
        document.getElementById('empSection').style.display = 'block';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('empWelcome').innerHTML = `<h3>مرحباً ${currentUser.name}</h3>`;
        let balance = 30 - (employees[currentUser.name]?.used || 0);
        document.getElementById('empWelcome').innerHTML += `<p>رصيدك المتبقي: ${balance} يوم</p>`;
        showEmployeeRequests();
    }
    
    // معالج تسجيل الدخول
    async function handleLogin() {
        let username = document.getElementById('username').value;
        let password = document.getElementById('password').value;
        
        await loadEmployees();
        
        if(username === 'admin' && password === 'admin123') {
            currentUser = { name: 'admin', role: 'admin' };
            showAdminPanel();
        } 
        else if(employees[username] && employees[username].password === password) {
            currentUser = { name: username, role: 'employee' };
            await loadRequests();
            showEmployeePanel();
        }
        else {
            alert("اسم المستخدم أو كلمة المرور غير صحيحة");
        }
    }
    
    // ربط الأحداث
    document.getElementById('loginBtn').onclick = handleLogin;
    document.getElementById('addEmpBtn').onclick = addEmployee;
    document.getElementById('submitLeaveBtn').onclick = submitRequest;
    
    // بدء التشغيل
    async function init() {
        await loadEmployees();
        await loadRequests();
        console.log("✅ النظام جاهز");
    }
    
    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MMC | نظام إدارة الإجازات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(145deg, #eef2f9 0%, #e0e8f2 100%); min-height: 100vh; padding: 30px 20px; }
        .app-container { max-width: 1400px; margin: 0 auto; }
        
        /* شاشة تسجيل الدخول */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 40px; width: 90%; max-width: 400px; text-align: center; }
        .login-box input { margin: 15px 0; padding: 12px; border-radius: 28px; border: 1px solid #cfdfed; width: 100%; }
        .login-box button { background: #2c7da0; color: white; padding: 12px; border-radius: 28px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
        
        .company-header { background: #1a2c3e; color: white; padding: 20px 30px; border-radius: 40px; margin-bottom: 35px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; align-items: center; }
        .company-header h1 { font-weight: 800; font-size: 1.9rem; }
        .company-header h1 i { color: #ffb347; margin-left: 12px; }
        .badge-system { background: #2c4b66; padding: 8px 18px; border-radius: 50px; font-weight: 600; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 28px; margin-bottom: 40px; }
        .card { background: white; border-radius: 32px; box-shadow: 0 12px 28px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background: #f8fafd; padding: 18px 24px; border-bottom: 2px solid #e9edf2; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; color: #1f3a4b; }
        .card-header i { color: #2c7da0; }
        .card-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e2f3e; }
        select, input, button { width: 100%; padding: 12px 16px; border-radius: 28px; border: 1px solid #cfdfed; font-size: 0.95rem; background: white; outline: none; }
        button { background: #2c7da0; color: white; font-weight: 700; border: none; cursor: pointer; }
        button:hover { background: #1f5e7e; }
        .btn-outline { background: #eef2f9; color: #1f5e7e; border: 1px solid #cbdbe2; }
        .btn-whatsapp { background: #25D366; }
        .btn-excel { background: #1f7b4d; }
        .btn-logout { background: #dc3545; width: auto; padding: 8px 20px; }
        .btn-add { background: #28a745; }
        .btn-sm { padding: 5px 10px; font-size: 0.7rem; width: auto; border-radius: 40px; }
        .btn-success-sm { background: #28a745; }
        .btn-danger-sm { background: #dc3545; }
        
        .requests-section { background: white; border-radius: 32px; padding: 20px; overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #e4e9f0; }
        th { background: #f1f5f9; font-weight: 700; }
        .status-badge { display: inline-block; padding: 4px 14px; border-radius: 40px; font-weight: 600; font-size: 0.75rem; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        
        .balance-box { background: #e9f2f5; padding: 12px; border-radius: 28px; margin-top: 15px; text-align: center; font-weight: 700; }
        .log-panel { max-height: 200px; overflow-y: auto; background: #f9fafc; border-radius: 24px; padding: 12px; font-size: 0.75rem; border: 1px solid #e2e8f0; }
        
        /* بوابة الموظف - محسنة */
        .employee-portal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .portal-content { background: white; max-width: 600px; width: 90%; border-radius: 40px; padding: 30px; max-height: 85vh; overflow-y: auto; }
        .portal-content .btn-primary { background: #2c7da0; font-size: 1.1rem; padding: 15px; margin: 10px 0; }
        .portal-content .btn-primary i { margin-left: 10px; }
        .request-form-card { background: #f0f7fa; border-radius: 28px; padding: 20px; margin: 15px 0; border: 2px solid #2c7da0; }
        .request-form-card h4 { color: #2c7da0; margin-bottom: 15px; font-size: 1.2rem; }
        
        .employee-list { max-height: 200px; overflow-y: auto; border: 1px solid #cfdfed; border-radius: 20px; padding: 10px; margin-top: 10px; }
        .employee-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
        .delete-emp { color: #dc3545; cursor: pointer; background: none; border: none; width: auto; padding: 0 8px; }
        
        .admin-only { display: block; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        
        footer { text-align: center; margin-top: 40px; font-size: 0.8rem; color: #4a627a; }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .success-msg { background: #d4edda; color: #155724; padding: 10px; border-radius: 20px; margin-top: 10px; text-align: center; }
        
        .big-icon { font-size: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="app-container" id="appContainer" style="display: none;">
    <div class="company-header">
        <h1><i class="fas fa-building"></i> MMC | نظام إدارة الإجازات</h1>
        <div class="user-info">
            <span class="badge-system" id="userRoleBadge"></span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button>
        </div>
    </div>

    <!-- لوحة المدير فقط -->
    <div id="adminPanel">
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header"><i class="fas fa-user-plus"></i> إضافة موظف جديد</div>
                <div class="card-body">
                    <div class="form-group"><label>اسم الموظف الجديد</label><input type="text" id="newEmployeeName" placeholder="مثال: منى عبدالله"></div>
                    <div class="form-group"><label>كلمة المرور</label><input type="text" id="newEmployeePassword" value="123"></div>
                    <button id="addEmployeeBtn" class="btn-add"><i class="fas fa-plus"></i> إضافة موظف</button>
                    <div id="addEmployeeMsg"></div>
                    <div class="employee-list">
                        <strong>📋 قائمة الموظفين:</strong>
                        <div id="employeesListContainer"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-calendar-plus"></i> إضافة طلب إجازة</div>
                <div class="card-body">
                    <div class="form-group"><label>الموظف</label><select id="employeeSelect"></select></div>
                    <div class="form-group"><label>نوع الإجازة</label><select id="leaveType">
                        <option value="سنوية">سنوية</option><option value="مرضية">مرضية</option>
                        <option value="طارئة">طارئة</option><option value="مامورية">مامورية</option>
                    </select></div>
                    <div class="form-group"><label>تاريخ البدء</label><input type="date" id="startDate"></div>
                    <div class="form-group"><label>عدد الأيام</label><input type="number" id="daysCount" min="1" value="1"></div>
                    <button id="submitRequestBtn"><i class="fas fa-paper-plane"></i> إرسال الطلب</button>
                    <div class="balance-box" id="balancePreview">الرصيد المتاح: --</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-link"></i> روابط دائمة للموظفين</div>
                <div class="card-body">
                    <div class="form-group"><label>اختر الموظف</label><select id="shareEmployeeSelect"></select></div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button id="generateLinkBtn" class="btn-outline"><i class="fas fa-link"></i> إنشاء الرابط</button>
                        <button id="copyLinkBtn" class="btn-outline"><i class="fas fa-copy"></i> نسخ الرابط</button>
                        <button id="whatsappShareBtn" class="btn-whatsapp"><i class="fab fa-whatsapp"></i> واتساب</button>
                    </div>
                    <div class="balance-box" id="generatedLinkBox" style="word-break: break-all; font-size: 0.7rem;">💡 اضغط "إنشاء الرابط"</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-layer-group"></i> تعديل جماعي</div>
                <div class="card-body">
                    <select id="bulkStatusFilter"><option value="pending">طلبات معلقة</option></select>
                    <div style="display: flex; gap: 10px; margin: 12px 0;">
                        <button id="bulkApproveBtn" style="background:#28a745;">موافقة جماعية</button>
                        <button id="bulkRejectBtn" style="background:#dc3545;">رفض جماعي</button>
                    </div>
                    <button id="exportExcelBtn" class="btn-excel"><i class="fas fa-file-excel"></i> تصدير Excel</button>
                    <div class="log-panel" id="logPanel" style="margin-top: 15px;"><div class="log-entry">✨ سجل العمليات</div></div>
                    <button id="clearLogBtn" class="btn-outline" style="margin-top: 8px;">مسح السجل</button>
                </div>
            </div>
        </div>
    </div>

    <!-- جدول الطلبات -->
    <div class="requests-section">
        <div class="filter-bar" id="filterBar">
            <div class="filter-group" id="adminFilterGroup">
                <select id="filterEmployee"><option value="all">جميع الموظفين</option></select>
                <input type="date" id="filterDate">
                <button id="resetFilterBtn" class="btn-outline">إعادة ضبط</button>
            </div>
            <div class="filter-group" id="adminApprovalGroup">
                <select id="approvalRequestSelect"><option value="">اختر طلب للموافقة</option></select>
                <button id="approveBtn" style="background:#28a745;">موافقة</button>
                <button id="rejectBtn" style="background:#dc3545;">رفض</button>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table id="requestsTable">
                <thead id="tableHeader">
                    <th>ID</th><th>الموظف</th><th>النوع</th><th>تاريخ البدء</th><th>الأيام</th><th>الحالة</th>
                </thead>
                <tbody id="requestsTableBody"><tr><td colspan="6">جاري التحميل...</td></tr>
                </tbody>
             
        </div>
    </div>
    <footer>MMC | نظام متكامل - المدير يتحكم كاملاً - الموظف يقدم طلباته من بوابته الشخصية</footer>
</div>

<script>
    // ===================== البيانات الأساسية =====================
    let requests = [];
    let employees = {
        "أحمد حسن": { password: "123", totalAnnual: 30, used: 0 },
        "سارة محمود": { password: "123", totalAnnual: 30, used: 0 },
        "محمد علي": { password: "123", totalAnnual: 30, used: 0 },
        "نورهان سمير": { password: "123", totalAnnual: 30, used: 0 },
        "خالد يوسف": { password: "123", totalAnnual: 30, used: 0 }
    };
    let operationLog = [];
    let currentUser = null;

    // ===================== الحفظ التلقائي =====================
    function saveToLocalStorage() {
        let data = { requests: requests, employees: employees, log: operationLog.slice(0, 50) };
        localStorage.setItem('MMC_LeavesSystem', JSON.stringify(data));
    }

    function loadFromLocalStorage() {
        let saved = localStorage.getItem('MMC_LeavesSystem');
        if(saved) {
            try {
                let data = JSON.parse(saved);
                requests = data.requests || [];
                employees = data.employees || employees;
                operationLog = data.log || [];
                recalcUsedBalance();
                return true;
            } catch(e) { console.error(e); }
        }
        return false;
    }

    function addLog(msg) {
        operationLog.unshift({ time: new Date().toLocaleString('ar-EG'), text: msg });
        if(operationLog.length > 100) operationLog.pop();
        const panel = document.getElementById('logPanel');
        if(panel) panel.innerHTML = operationLog.map(l=>`<div class="log-entry">[${l.time}] ${l.text}</div>`).join('');
        saveToLocalStorage();
    }

    // ===================== حساب الرصيد =====================
    function getRemainingBalance(emp) {
        let empData = employees[emp];
        if(!empData) return 30;
        let rem = empData.totalAnnual - (empData.used || 0);
        return rem < 0 ? 0 : rem;
    }

    function recalcUsedBalance() {
        for(let emp in employees) employees[emp].used = 0;
        requests.forEach(req => {
            if(req.status === 'approved' && req.type === 'سنوية') {
                if(employees[req.employee]) employees[req.employee].used += req.days;
            }
        });
    }

    function updateBalancePreview() {
        let emp = document.getElementById('employeeSelect')?.value;
        if(emp && employees[emp]) {
            let rem = getRemainingBalance(emp);
            document.getElementById('balancePreview').innerHTML = `<i class="fas fa-coins"></i> ${emp} : الرصيد المتاح ${rem} / 30 يوم`;
        }
    }

    // تحديث قائمة الموظفين
    function updateAllEmployeeDropdowns() {
        let employeeNames = Object.keys(employees);
        
        let selects = ['employeeSelect', 'shareEmployeeSelect', 'filterEmployee'];
        selects.forEach(selectId => {
            let select = document.getElementById(selectId);
            if(select) {
                let currentVal = select.value;
                select.innerHTML = '';
                if(selectId === 'filterEmployee') select.innerHTML = '<option value="all">جميع الموظفين</option>';
                employeeNames.forEach(emp => {
                    let option = document.createElement('option');
                    option.value = emp;
                    option.textContent = emp;
                    select.appendChild(option);
                });
                if(currentVal && employeeNames.includes(currentVal)) select.value = currentVal;
            }
        });
        
        let container = document.getElementById('employeesListContainer');
        if(container) {
            container.innerHTML = employeeNames.map(emp => `
                <div class="employee-item">
                    <span><i class="fas fa-user"></i> ${emp} (الرصيد: ${getRemainingBalance(emp)}/30)</span>
                    <button class="delete-emp" onclick="deleteEmployee('${emp}')"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }
    }

    window.deleteEmployee = function(empName) {
        if(currentUser?.role !== 'admin') return;
        if(confirm(`هل تريد حذف الموظف ${empName}؟`)) {
            requests = requests.filter(r => r.employee !== empName);
            delete employees[empName];
            updateAllEmployeeDropdowns();
            renderRequestsTable();
            recalcUsedBalance();
            addLog(`🗑️ تم حذف الموظف ${empName}`);
            saveToLocalStorage();
        }
    };

    function addNewEmployee() {
        let name = document.getElementById('newEmployeeName').value.trim();
        let password = document.getElementById('newEmployeePassword').value.trim();
        let msgDiv = document.getElementById('addEmployeeMsg');
        
        if(!name) { msgDiv.innerHTML = '<div class="success-msg" style="background:#f8d7da; color:#721c24;">❌ الرجاء إدخال اسم الموظف</div>'; return; }
        if(employees[name]) { msgDiv.innerHTML = '<div class="success-msg" style="background:#f8d7da; color:#721c24;">❌ هذا الموظف موجود بالفعل</div>'; return; }
        if(!password) password = "123";
        
        employees[name] = { password: password, totalAnnual: 30, used: 0 };
        updateAllEmployeeDropdowns();
        document.getElementById('newEmployeeName').value = '';
        addLog(`➕ تم إضافة موظف جديد: ${name}`);
        saveToLocalStorage();
        
        let link = generatePermanentLink(name);
        msgDiv.innerHTML = `<div class="success-msg">✅ تم إضافة الموظف ${name}<br>🔑 كلمة المرور: ${password}<br>🔗 الرابط: <span style="font-size:0.7rem;">${link}</span><br>
        <button onclick="copyText('${link}')" style="margin-top:8px; width:auto; padding:5px 15px;">📋 نسخ الرابط</button></div>`;
        setTimeout(() => { msgDiv.innerHTML = ''; }, 6000);
    }
    
    window.copyText = function(text) { navigator.clipboard.writeText(text); alert("تم نسخ الرابط"); };

    // ===================== الرابط الدائم =====================
    function generatePermanentLink(employeeName) {
        let baseUrl = window.location.href.split('?')[0];
        let encoded = btoa(encodeURIComponent(employeeName));
        return `${baseUrl}?token=${encoded}`;
    }

    // ===================== بوابة الموظف المحسنة =====================
    function openEmployeePortal(employeeName) {
        let existing = document.getElementById('employeePortal');
        if(existing) existing.remove();
        
        let modal = document.createElement('div');
        modal.className = 'employee-portal';
        modal.id = 'employeePortal';
        modal.innerHTML = `
            <div class="portal-content">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2><i class="fas fa-user-circle"></i> مرحباً ${employeeName}</h2>
                    <button onclick="closePortal()" style="width:auto; background:#dc3545; padding:8px 16px; border-radius:50px;">✖ إغلاق</button>
                </div>
                
                <div class="balance-box" style="margin-bottom:20px; background:#2c7da0; color:white;">
                    <i class="fas fa-chart-line"></i> رصيدك السنوي المتبقي: <span style="font-size:1.5rem; font-weight:bold;">${getRemainingBalance(employeeName)}</span> / 30 يوم
                </div>
                
                <!-- نموذج تقديم طلب إجازة - واضح وبارز -->
                <div class="request-form-card">
                    <h4 style="text-align:center;"><i class="fas fa-calendar-plus" style="margin-left:10px;"></i> تقديم طلب إجازة جديد</h4>
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> نوع الإجازة</label>
                        <select id="portalLeaveType" style="border-radius:25px;">
                            <option value="سنوية">🌴 سنوية</option>
                            <option value="مرضية">🏥 مرضية</option>
                            <option value="طارئة">⚠️ طارئة</option>
                            <option value="مامورية">📋 مأمورية</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-day"></i> تاريخ بدء الإجازة</label>
                        <input type="date" id="portalStartDate" style="border-radius:25px;">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> عدد الأيام</label>
                        <input type="number" id="portalDaysCount" min="0.5" step="0.5" value="1" style="border-radius:25px;">
                    </div>
                    <button id="portalSubmitBtn" style="background:#28a745; font-size:1.1rem; padding:14px; border-radius:50px; margin-top:10px;">
                        <i class="fas fa-paper-plane"></i> إرسال الطلب
                    </button>
                </div>
                
                <h4 style="margin-top:20px;"><i class="fas fa-history"></i> طلباتي السابقة</h4>
                <div id="myRequestsList" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
                
                <div class="balance-box" style="margin-top:20px; background:#fef5e7; font-size:0.8rem;">
                    <i class="fas fa-info-circle"></i> سيتم إعلامك عند الموافقة على طلبك من قبل المدير
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.style.display = 'flex';
        
        function refreshRequests() {
            let myReqs = requests.filter(r => r.employee === employeeName);
            let html = myReqs.length === 0 ? 
                '<div style="text-align:center; padding:20px; color:#888;">لا توجد طلبات سابقة</div>' : 
                myReqs.map(r => `
                    <div style="border:1px solid #e0e0e0; border-radius:20px; padding:12px; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span><strong>${r.type}</strong> | ${r.startDate}</span>
                            <span class="status-badge ${r.status === 'pending' ? 'status-pending' : (r.status === 'approved' ? 'status-approved' : 'status-rejected')}">
                                ${r.status === 'pending' ? '⏳ قيد الانتظار' : (r.status === 'approved' ? '✅ موافق' : '❌ مرفوض')}
                            </span>
                        </div>
                        <div style="font-size:0.8rem; color:#666; margin-top:5px;">
                            <i class="fas fa-clock"></i> ${r.days} يوم
                        </div>
                    </div>
                `).join('');
            document.getElementById('myRequestsList').innerHTML = html;
        }
        refreshRequests();
        
        document.getElementById('portalSubmitBtn').onclick = () => {
            let type = document.getElementById('portalLeaveType').value;
            let startDate = document.getElementById('portalStartDate').value;
            let days = parseFloat(document.getElementById('portalDaysCount').value);
            
            if(!startDate) { alert("⚠️ يرجى تحديد تاريخ بدء الإجازة"); return; }
            if(isNaN(days) || days < 0.5) { alert("⚠️ عدد الأيام غير صحيح"); return; }
            
            if(type === 'سنوية' && days > getRemainingBalance(employeeName)) {
                if(!confirm(`⚠️ رصيدك المتبقي ${getRemainingBalance(employeeName)} يوم فقط. هل تريد تقديم الطلب على أمل الموافقة؟`)) return;
            }
            
            let newId = requests.length > 0 ? Math.max(...requests.map(r => r.id)) + 1 : 1;
            requests.push({
                id: newId, employee: employeeName, type, startDate, days: days,
                status: 'pending', attachment: null
            });
            refreshRequests();
            if(currentUser?.role === 'admin') renderRequestsTable();
            document.getElementById('portalStartDate').value = '';
            document.getElementById('portalDaysCount').value = '1';
            alert(`✅ تم إرسال طلبك رقم #${newId} بنجاح!`);
            addLog(`📝 ${employeeName} قدم طلب #${newId} من بوابته الشخصية`);
            saveToLocalStorage();
        };
    }
    
    window.closePortal = function() {
        let modal = document.getElementById('employeePortal');
        if(modal) modal.remove();
    };

    function checkUrlForToken() {
        let params = new URLSearchParams(window.location.search);
        let token = params.get('token');
        if(token) {
            try {
                let employeeName = decodeURIComponent(atob(token));
                if(employees[employeeName]) {
                    openEmployeePortal(employeeName);
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else {
                    alert("⚠️ الموظف غير موجود في النظام");
                }
            } catch(e) { console.error(e); }
        }
    }

    // ===================== دوال الموافقة والرفض =====================
    function approveRequestById(id) {
        if(currentUser?.role !== 'admin') return;
        let req = requests.find(r => r.id === id);
        if(!req || req.status !== 'pending') return;
        if(req.type === 'سنوية' && getRemainingBalance(req.employee) < req.days) {
            alert(`❌ رصيد غير كافٍ للموظف ${req.employee}`);
            return;
        }
        req.status = 'approved';
        recalcUsedBalance();
        renderRequestsTable();
        updateBalancePreview();
        addLog(`✅ الموافقة على الطلب #${id}`);
        saveToLocalStorage();
    }

    function rejectRequestById(id) {
        if(currentUser?.role !== 'admin') return;
        let req = requests.find(r => r.id === id);
        if(!req || req.status !== 'pending') return;
        req.status = 'rejected';
        renderRequestsTable();
        addLog(`❌ رفض الطلب #${id}`);
        saveToLocalStorage();
    }

    // ===================== إضافة طلب (للمدير) =====================
    function addNewRequest() {
        if(currentUser?.role !== 'admin') return;
        let employee = document.getElementById('employeeSelect').value;
        let type = document.getElementById('leaveType').value;
        let startDate = document.getElementById('startDate').value;
        let days = parseInt(document.getElementById('daysCount').value);
        
        if(!startDate) { alert("حدد تاريخ"); return; }
        if(isNaN(days) || days < 1) { alert("عدد الأيام غير صحيح"); return; }
        
        let newId = requests.length > 0 ? Math.max(...requests.map(r => r.id)) + 1 : 1;
        requests.push({ id: newId, employee, type, startDate, days, status: 'pending', attachment: null });
        renderRequestsTable();
        updateBalancePreview();
        document.getElementById('startDate').value = '';
        alert(`✅ تم إضافة الطلب #${newId}`);
        addLog(`➕ إضافة طلب #${newId} - ${employee}`);
        saveToLocalStorage();
    }

    // ===================== عرض الجدول =====================
    function renderRequestsTable() {
        let filtered = requests;
        
        if(currentUser?.role === 'employee') {
            filtered = requests.filter(r => r.employee === currentUser.name);
            document.getElementById('adminFilterGroup').style.display = 'none';
            document.getElementById('adminApprovalGroup').style.display = 'none';
        } else {
            let filterEmp = document.getElementById('filterEmployee')?.value;
            let filterDate = document.getElementById('filterDate')?.value;
            if(filterEmp && filterEmp !== 'all') filtered = filtered.filter(r => r.employee === filterEmp);
            if(filterDate) filtered = filtered.filter(r => r.startDate === filterDate);
            document.getElementById('adminFilterGroup').style.display = 'flex';
            document.getElementById('adminApprovalGroup').style.display = 'flex';
        }
        
        let tbody = document.getElementById('requestsTableBody');
        if(filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">لا توجد طلبات</td></tr>';
            return;
        }
        
        tbody.innerHTML = '';
        filtered.forEach(req => {
            let row = tbody.insertRow();
            row.insertCell(0).innerText = req.id;
            row.insertCell(1).innerText = req.employee;
            row.insertCell(2).innerText = req.type;
            row.insertCell(3).innerText = req.startDate;
            row.insertCell(4).innerText = req.days;
            
            let statusCell = row.insertCell(5);
            let cls = req.status === 'pending' ? 'status-pending' : (req.status === 'approved' ? 'status-approved' : 'status-rejected');
            let txt = req.status === 'pending' ? 'قيد الانتظار' : (req.status === 'approved' ? 'موافق' : 'مرفوض');
            statusCell.innerHTML = `<span class="status-badge ${cls}">${txt}</span>`;
        });
        
        if(currentUser?.role === 'admin') {
            let select = document.getElementById('approvalRequestSelect');
            let pendingReqs = requests.filter(r => r.status === 'pending');
            select.innerHTML = '<option value="">-- اختر طلب --</option>';
            pendingReqs.forEach(r => { select.innerHTML += `<option value="${r.id}">#${r.id} - ${r.employee} (${r.type})</option>`; });
        }
    }

    // ===================== دوال إضافية =====================
    function bulkAction(action) {
        if(currentUser?.role !== 'admin') return;
        let targets = requests.filter(r => r.status === 'pending');
        if(targets.length === 0) { alert("لا توجد طلبات للمعالجة"); return; }
        if(confirm(`${action === 'approve' ? 'موافقة جماعية' : 'رفض جماعي'} على ${targets.length} طلب؟`)) {
            targets.forEach(r => { if(action === 'approve') approveRequestById(r.id); else rejectRequestById(r.id); });
        }
    }

    function exportToExcel() {
        let data = requests.map(r => ({ 'ID': r.id, 'الموظف': r.employee, 'النوع': r.type, 'تاريخ البدء': r.startDate, 'عدد الأيام': r.days, 'الحالة': r.status === 'pending' ? 'قيد الانتظار' : (r.status === 'approved' ? 'موافق' : 'مرفوض') }));
        let ws = XLSX.utils.json_to_sheet(data);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'الطلبات');
        XLSX.writeFile(wb, `MMC_Requests.xlsx`);
        addLog("📎 تصدير Excel");
    }

    function showGeneratedLink() {
        let emp = document.getElementById('shareEmployeeSelect').value;
        let link = generatePermanentLink(emp);
        document.getElementById('generatedLinkBox').innerHTML = `<i class="fas fa-link"></i> رابط <strong>${emp}</strong>:<br><span style="font-size:0.65rem;">${link}</span>`;
    }

    function copyGeneratedLink() {
        let emp = document.getElementById('shareEmployeeSelect').value;
        let link = generatePermanentLink(emp);
        navigator.clipboard.writeText(link);
        alert("✅ تم نسخ الرابط");
    }

    function shareLinkOnWhatsApp() {
        let emp = document.getElementById('shareEmployeeSelect').value;
        let link = generatePermanentLink(emp);
        let msg = `📋 MMC - رابط الإجازات\nمرحباً ${emp}، هذا رابطك الشخصي لتقديم طلبات الإجازة:\n${link}\n🔑 كلمة المرور: ${employees[emp]?.password}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // ===================== تسجيل الدخول =====================
    function showLoginScreen() {
        let loginDiv = document.createElement('div');
        loginDiv.className = 'login-overlay';
        loginDiv.id = 'loginScreen';
        loginDiv.innerHTML = `
            <div class="login-box">
                <i class="fas fa-building" style="font-size: 50px; color: #2c7da0;"></i>
                <h2 style="margin:20px 0;">MMC | نظام الإجازات</h2>
                <input type="text" id="loginUsername" placeholder="اسم المستخدم">
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
                <button id="loginBtn">تسجيل الدخول</button>
                <div class="balance-box" style="margin-top:20px; font-size:0.7rem;">
                    <strong>👑 مدير:</strong> admin / admin123<br>
                    <strong>👤 موظف:</strong> اسم الموظف / 123<br>
                    <i class="fas fa-link"></i> أو استخدم الرابط الدائم المرسل من المدير
                </div>
            </div>
        `;
        document.body.appendChild(loginDiv);
        
        document.getElementById('loginBtn').onclick = () => {
            let username = document.getElementById('loginUsername').value;
            let password = document.getElementById('loginPassword').value;
            
            if(username === 'admin' && password === 'admin123') {
                currentUser = { name: 'admin', role: 'admin' };
                document.getElementById('userRoleBadge').innerHTML = '<i class="fas fa-crown"></i> مدير النظام';
                document.getElementById('loginScreen').remove();
                document.getElementById('appContainer').style.display = 'block';
                updateAllEmployeeDropdowns();
                renderRequestsTable();
                updateBalancePreview();
                addLog("🔐 دخول المدير");
            } 
            else if(employees[username] && employees[username].password === password) {
                currentUser = { name: username, role: 'employee' };
                document.getElementById('userRoleBadge').innerHTML = `<i class="fas fa-user"></i> موظف: ${username}`;
                document.getElementById('loginScreen').remove();
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('adminFilterGroup').style.display = 'none';
                document.getElementById('adminApprovalGroup').style.display = 'none';
                document.getElementById('tableHeader').innerHTML = '<th>ID</th><th>النوع</th><th>تاريخ البدء</th><th>الأيام</th><th>الحالة</th>';
                renderRequestsTable();
                addLog(`🔐 دخول الموظف: ${username}`);
                alert(`👋 مرحباً ${username}\n\n📝 يمكنك تقديم طلبات الإجازة من خلال الرابط الذي أرسله لك المدير.\n\n🔗 إذا لم يكن لديك الرابط، تواصل مع المدير لإرساله لك.`);
            } 
            else { alert("❌ اسم المستخدم أو كلمة المرور غير صحيحة"); }
        };
    }

    function logout() {
        currentUser = null;
        document.getElementById('appContainer').style.display = 'none';
        location.reload();
    }

    // ===================== تحميل بيانات أولية =====================
    function loadInitialData() {
        if(!loadFromLocalStorage()) {
            requests = [
                { id: 101, employee: "أحمد حسن", type: "سنوية", startDate: "2026-05-10", days: 5, status: "pending", attachment: null },
                { id: 102, employee: "سارة محمود", type: "مرضية", startDate: "2026-04-20", days: 2, status: "pending", attachment: null },
                { id: 103, employee: "محمد علي", type: "سنوية", startDate: "2026-06-01", days: 10, status: "pending", attachment: null },
                { id: 104, employee: "نورهان سمير", type: "طارئة", startDate: "2026-04-18", days: 1, status: "approved", attachment: null },
                { id: 105, employee: "خالد يوسف", type: "سنوية", startDate: "2026-07-05", days: 3, status: "pending", attachment: null }
            ];
        }
        recalcUsedBalance();
    }

    // ===================== ربط الأحداث =====================
    function bindEvents() {
        document.getElementById('addEmployeeBtn')?.addEventListener('click', addNewEmployee);
        document.getElementById('submitRequestBtn')?.addEventListener('click', addNewRequest);
        document.getElementById('resetFilterBtn')?.addEventListener('click', () => {
            document.getElementById('filterEmployee').value = 'all';
            document.getElementById('filterDate').value = '';
            renderRequestsTable();
        });
        document.getElementById('filterEmployee')?.addEventListener('change', () => renderRequestsTable());
        document.getElementById('filterDate')?.addEventListener('change', () => renderRequestsTable());
        document.getElementById('employeeSelect')?.addEventListener('change', () => updateBalancePreview());
        document.getElementById('bulkApproveBtn')?.addEventListener('click', () => bulkAction('approve'));
        document.getElementById('bulkRejectBtn')?.addEventListener('click', () => bulkAction('reject'));
        document.getElementById('exportExcelBtn')?.addEventListener('click', exportToExcel);
        document.getElementById('clearLogBtn')?.addEventListener('click', () => { operationLog = []; addLog("مسح السجل"); });
        document.getElementById('approveBtn')?.addEventListener('click', () => { let id = document.getElementById('approvalRequestSelect').value; if(id) approveRequestById(parseInt(id)); });
        document.getElementById('rejectBtn')?.addEventListener('click', () => { let id = document.getElementById('approvalRequestSelect').value; if(id) rejectRequestById(parseInt(id)); });
        document.getElementById('generateLinkBtn')?.addEventListener('click', showGeneratedLink);
        document.getElementById('copyLinkBtn')?.addEventListener('click', copyGeneratedLink);
        document.getElementById('whatsappShareBtn')?.addEventListener('click', shareLinkOnWhatsApp);
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
    }

    function init() {
        loadInitialData();
        bindEvents();
        showLoginScreen();
        checkUrlForToken();
    }
    
    init();
</script>
</body>
</html>

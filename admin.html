<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>MMC - لوحة المدير</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, sans-serif; }
        html { width: 100%; min-height: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
        :root {
            --bg: #f4f6f8; --card: #fff; --text: #1a1a2e; --muted: #667085; --border: #dde2ea;
            --input: #fff; --shadow: rgba(18,24,38,.1); --primary: #1a1a2e; --primary-2: #2d2d4e;
            --accent: #c9a84c; --success: #198754; --danger: #dc3545; --warning: #ffc107; --info: #0dcaf0;
            --table: #f8fafc;
        }
        [data-theme="dark"] {
            --bg: #0d0d1a; --card: #17172b; --text: #f0f2f5; --muted: #a4a9b4; --border: #2b2f48;
            --input: #101020; --shadow: rgba(0,0,0,.4); --primary: #0d0d1a; --primary-2: #232344;
            --accent: #d4b85c; --table: #101020;
        }
        body { min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        button, input, select, textarea { font: inherit; }
        button { line-height: 1.2; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .header {
            position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff; border-bottom: 3px solid var(--accent); padding: 10px 14px;
        }
        .header-content { max-width: 1380px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 9px; }
        .logo { width: 40px; height: 40px; display: grid; place-items: center; border: 1.5px solid var(--accent); border-radius: 8px; color: var(--accent); font-weight: 800; line-height: 1; flex: 0 0 40px; }
        .brand h1 { font-size: 14px; line-height: 1.2; }
        .brand span { display: block; color: var(--accent); font-size: 8px; letter-spacing: 1px; }
        .header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .header-btn {
            border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #fff;
            padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 12px; min-height: 34px;
        }
        #userName { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .container { max-width: 1380px; margin: 16px auto; padding: 0 12px; }
        .tabs, .filters {
            display: flex; gap: 7px; flex-wrap: wrap; background: var(--card); padding: 8px; border-radius: 10px;
            box-shadow: 0 4px 14px var(--shadow); margin-bottom: 14px;
        }
        .tab {
            flex: 1 0 120px; border: 0; background: transparent; color: var(--muted); padding: 10px 12px;
            border-radius: 8px; cursor: pointer; font-weight: 650; min-height: 40px;
        }
        .tab.active { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 12px; margin-bottom: 14px; }
        .stat-card {
            background: var(--card); border-radius: 10px; padding: 16px 12px; box-shadow: 0 4px 14px var(--shadow);
            border-top: 3px solid var(--accent); text-align: center;
        }
        .stat-label { color: var(--muted); font-size: 13px; }
        .stat-value { color: var(--accent); font-size: 30px; font-weight: 800; margin-top: 4px; }
        .section { background: var(--card); border-radius: 10px; box-shadow: 0 4px 14px var(--shadow); padding: 16px; margin-bottom: 14px; }
        .section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .section-title h2 { font-size: 17px; }
        input, select, textarea {
            width: 100%; border: 1.5px solid var(--border); border-radius: 8px; background: var(--input); color: var(--text);
            padding: 10px 11px; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        .filters > div { flex: 1 1 180px; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px; }
        th { background: var(--table); text-align: right; color: var(--text); padding: 10px 8px; white-space: nowrap; }
        td { border-bottom: 1px solid var(--border); padding: 10px 8px; color: var(--text); vertical-align: middle; }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .remaining { background: #e8f5e9; color: #1b5e20; }
        .remaining.low { background: #fdecea; color: #b42318; }
        .btn {
            border: 0; border-radius: 7px; padding: 8px 10px; cursor: pointer; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 34px;
        }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #2b2b2b; }
        .btn-info { background: var(--info); color: #083344; }
        .btn-secondary { background: #667085; color: #fff; }
        .actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .employee-card {
            display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap;
            border: 1px solid var(--border); border-radius: 10px; padding: 13px; margin-bottom: 10px;
        }
        .employee-card h3 { font-size: 15px; margin-bottom: 7px; }
        .employee-stats { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
        .modal {
            display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.55);
            align-items: center; justify-content: center; padding: 14px;
        }
        .modal.show { display: flex; }
        .modal-content {
            width: min(100%, 440px); max-height: 90vh; overflow-y: auto; background: var(--card);
            border-radius: 12px; padding: 20px; border-top: 4px solid var(--accent);
        }
        .modal-content h2 { font-size: 18px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; color: var(--muted); font-weight: 650; font-size: 13px; }
        .empty { text-align: center; padding: 34px; color: var(--muted); }
        @media (max-width: 760px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .header-content { align-items: stretch; }
            .header-actions { justify-content: center; }
            .btn { padding: 9px 10px; }
        }
        @media (max-width: 420px) {
            .stats-grid { grid-template-columns: 1fr; }
            .tab { flex-basis: 100px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <div class="logo">MMC</div>
                <h1>MURTADA MAAZ <span>CONSULTANCY</span></h1>
            </div>
            <div class="header-actions">
                <span id="userName"></span>
                <button class="header-btn" type="button" id="themeToggle">🌙</button>
                <button class="header-btn" type="button" id="openChangePassword">🔐 كلمة المرور</button>
                <button class="header-btn" type="button" id="logoutButton">🚪 خروج</button>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="tabs" aria-label="أقسام لوحة المدير">
            <button class="tab active" type="button" data-tab="requests">طلبات الإجازات</button>
            <button class="tab" type="button" data-tab="employees">الموظفون</button>
            <button class="tab" type="button" data-tab="missions">المأموريات</button>
        </nav>

        <section id="requestsTab" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">الإجمالي</div><div class="stat-value" id="totalRequests">0</div></div>
                <div class="stat-card"><div class="stat-label">معلقة</div><div class="stat-value" id="pendingRequests">0</div></div>
                <div class="stat-card"><div class="stat-label">مقبولة</div><div class="stat-value" id="approvedRequests">0</div></div>
                <div class="stat-card"><div class="stat-label">مرفوضة</div><div class="stat-value" id="rejectedRequests">0</div></div>
            </div>

            <div class="filters">
                <div><input id="requestSearch" type="search" placeholder="بحث باسم الموظف أو نوع الإجازة"></div>
                <div>
                    <select id="yearFilter">
                        <option value="">كل السنوات</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <div>
                    <select id="statusFilter">
                        <option value="">كل الحالات</option>
                        <option value="pending">قيد الانتظار</option>
                        <option value="approved">مقبول</option>
                        <option value="rejected">مرفوض</option>
                    </select>
                </div>
                <div><input id="dateFilter" type="date"></div>
            </div>

            <div class="section">
                <div class="section-title">
                    <h2>جميع الطلبات</h2>
                    <div class="actions">
                        <button class="btn btn-success" type="button" id="exportRequests">📊 طلبات Excel</button>
                        <button class="btn btn-info" type="button" id="exportAllData">📦 كل البيانات</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>الموظف</th><th>السنة</th><th>النوع</th><th>تاريخ البدء</th><th>الأيام</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="employeesTab" class="tab-content">
            <div class="section">
                <div class="section-title">
                    <h2>قائمة الموظفين</h2>
                    <div class="actions">
                        <button class="btn btn-info" type="button" id="exportEmployees">📊 Excel</button>
                        <button class="btn btn-success" type="button" id="openAddEmployee">➕ موظف</button>
                    </div>
                </div>
                <div id="employeesList"></div>
            </div>
        </section>

        <section id="missionsTab" class="tab-content">
            <div class="section">
                <div class="section-title">
                    <h2>المأموريات</h2>
                    <div class="actions">
                        <button class="btn btn-info" type="button" id="exportMissions">📊 Excel</button>
                        <button class="btn btn-success" type="button" id="openAddMission">➕ مأمورية</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>الموظف</th><th>النوع</th><th>من</th><th>إلى</th><th>الوصف</th><th>الحالة</th><th>حذف</th></tr>
                        </thead>
                        <tbody id="missionsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <h2>تغيير كلمة المرور</h2>
            <form id="changePasswordForm">
                <div class="form-group"><label>كلمة المرور الحالية</label><input type="password" id="currentPassword" required></div>
                <div class="form-group"><label>كلمة المرور الجديدة</label><input type="password" id="newPassword" minlength="3" required></div>
                <div class="form-group"><label>تأكيد كلمة المرور</label><input type="password" id="confirmPassword" minlength="3" required></div>
                <button class="btn btn-success" style="width:100%" type="submit">حفظ</button>
                <button class="btn btn-danger" style="width:100%; margin-top:8px" type="button" data-close="changePasswordModal">إلغاء</button>
            </form>
        </div>
    </div>

    <div id="addEmployeeModal" class="modal">
        <div class="modal-content">
            <h2>إضافة موظف</h2>
            <form id="addEmployeeForm">
                <div class="form-group"><label>اسم الموظف</label><input type="text" id="empName" required></div>
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="empUsername" required placeholder="مثال: ahmed"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="empPassword" minlength="3" required></div>
                <div class="form-group"><label>الرصيد السنوي</label><input type="number" id="empTotalDays" value="30" min="1" max="365"></div>
                <button class="btn btn-success" style="width:100%" type="submit">إضافة</button>
                <button class="btn btn-danger" style="width:100%; margin-top:8px" type="button" data-close="addEmployeeModal">إلغاء</button>
            </form>
        </div>
    </div>

    <div id="addMissionModal" class="modal">
        <div class="modal-content">
            <h2>إضافة مأمورية</h2>
            <form id="addMissionForm">
                <div class="form-group"><label>الموظف</label><select id="missionEmployee" required></select></div>
                <div class="form-group">
                    <label>النوع</label>
                    <select id="missionType" required>
                        <option value="داخلية">داخلية</option><option value="خارجية">خارجية</option>
                        <option value="تدريب">تدريب</option><option value="مؤتمر">مؤتمر</option>
                    </select>
                </div>
                <div class="form-group"><label>تاريخ البدء</label><input type="date" id="missionStartDate" required></div>
                <div class="form-group"><label>تاريخ الانتهاء</label><input type="date" id="missionEndDate" required></div>
                <div class="form-group"><label>الوصف</label><textarea id="missionDescription" rows="3"></textarea></div>
                <button class="btn btn-success" style="width:100%" type="submit">إضافة</button>
                <button class="btn btn-danger" style="width:100%; margin-top:8px" type="button" data-close="addMissionModal">إلغاء</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const SUPABASE_URL = "https://ueszjhtztdlqaduogzog.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk";
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allRequests = [];
        let allEmployees = [];
        let allMissions = [];
        const CREATE_EMPLOYEE_FUNCTION = "smart-function";
        const SET_EMPLOYEE_PASSWORD_FUNCTION = "hyper-api";

        const $ = (id) => document.getElementById(id);
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
        const statusText = { pending: "قيد الانتظار", approved: "مقبول", rejected: "مرفوض" };

        async function invokeAdminFunction(name, body) {
            const { data, error } = await supabase.functions.invoke(name, { body });
            if (error) {
                let message = error.message || "فشلت العملية";
                if (message.includes("Failed to send a request")) {
                    message = "تعذر الاتصال بـ Edge Function. تأكد أن الدالة منشورة في Supabase وبنفس الاسم.";
                }
                try {
                    if (error.context) {
                        const details = await error.context.json();
                        message = details.error || message;
                    }
                } catch {
                    // Keep the default message when the function did not return JSON.
                }
                throw new Error(message);
            }
            if (data?.error) throw new Error(data.error);
            return data;
        }

        function initTheme() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            $("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
            document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0d0d1a" : "#1a1a2e";
        }

        function openModal(id) { $(id).classList.add("show"); }
        function closeModal(id) { $(id).classList.remove("show"); const form = $(id).querySelector("form"); if (form) form.reset(); }

        async function checkAuth() {
            const { data: sessionData } = await supabase.auth.getSession();
            const authUser = sessionData.session?.user;
            if (!authUser) return window.location.href = "index.html";

            const { data: employee, error } = await supabase
                .from("employees")
                .select("id, name, username, role, total_annual, used")
                .eq("auth_user_id", authUser.id)
                .single();

            if (error || !employee) {
                await supabase.auth.signOut();
                localStorage.removeItem("currentUser");
                return window.location.href = "index.html";
            }

            currentUser = employee;
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            if (currentUser.role !== "admin") return window.location.href = "employee.html";
            $("userName").textContent = `مدير: ${currentUser.name}`;
            loadAllData();
        }

        async function loadAllData() {
            await Promise.all([loadAllRequests(), loadAllEmployees(), loadAllMissions()]);
        }

        async function loadAllRequests() {
            const { data, error } = await supabase
                .from("requests")
                .select("*, employees:employee_id (id, name, total_annual, used)")
                .order("created_at", { ascending: false });
            if (error) return alert("فشل تحميل الطلبات: " + error.message);
            allRequests = data || [];
            updateStats();
            renderRequests();
        }

        function updateStats() {
            $("totalRequests").textContent = allRequests.length;
            $("pendingRequests").textContent = allRequests.filter((r) => r.status === "pending").length;
            $("approvedRequests").textContent = allRequests.filter((r) => r.status === "approved").length;
            $("rejectedRequests").textContent = allRequests.filter((r) => r.status === "rejected").length;
        }

        function getFilteredRequests() {
            const search = $("requestSearch").value.trim().toLowerCase();
            const year = $("yearFilter").value;
            const status = $("statusFilter").value;
            const date = $("dateFilter").value;
            return allRequests.filter((req) => {
                const empName = req.employees?.name || "";
                const requestYear = String(req.leave_year || new Date(req.start_date).getFullYear());
                const matchesSearch = !search || empName.toLowerCase().includes(search) || String(req.type).toLowerCase().includes(search);
                const matchesYear = !year || requestYear === year;
                const matchesStatus = !status || req.status === status;
                const matchesDate = !date || req.start_date === date;
                return matchesSearch && matchesYear && matchesStatus && matchesDate;
            });
        }

        function renderRequests() {
            const requests = getFilteredRequests();
            const tbody = $("requestsTableBody");
            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty">لا توجد طلبات مطابقة</td></tr>';
                return;
            }
            tbody.innerHTML = requests.map((req) => {
                const employee = req.employees || {};
                const remaining = (employee.total_annual || 30) - (employee.used || 0);
                const canApprove = req.status === "pending";
                return `
                    <tr>
                        <td>${escapeHtml(employee.name || "غير معروف")}</td>
                        <td>${escapeHtml(req.leave_year || new Date(req.start_date).getFullYear())}</td>
                        <td>${escapeHtml(req.type)}</td>
                        <td>${escapeHtml(req.start_date)}</td>
                        <td>${escapeHtml(req.days)}</td>
                        <td><span class="badge remaining ${remaining < 5 ? "low" : ""}">${remaining}</span></td>
                        <td><span class="badge status-${escapeHtml(req.status)}">${statusText[req.status] || escapeHtml(req.status)}</span></td>
                        <td>
                            <div class="actions">
                                ${canApprove ? `
                                    <button class="btn btn-success" data-action="approve" data-id="${escapeHtml(req.id)}">قبول</button>
                                    <button class="btn btn-danger" data-action="reject" data-id="${escapeHtml(req.id)}">رفض</button>
                                ` : `<button class="btn btn-warning" data-action="reset" data-id="${escapeHtml(req.id)}">إرجاع</button>`}
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        async function approveRequest(id) {
            const request = allRequests.find((r) => String(r.id) === String(id));
            if (!request || request.status !== "pending") return;
            const employee = request.employees;
            const remaining = (employee?.total_annual || 30) - (employee?.used || 0);
            if (Number(request.days) > remaining) {
                alert(`لا يمكن قبول الطلب. الرصيد المتبقي ${remaining} يوم فقط.`);
                return;
            }
            const { data: latest } = await supabase.from("requests").select("status").eq("id", id).single();
            if (latest?.status !== "pending") {
                alert("تم تغيير حالة هذا الطلب مسبقاً.");
                return loadAllData();
            }
            const { error: requestError } = await supabase.from("requests").update({ status: "approved" }).eq("id", id).eq("status", "pending");
            if (requestError) return alert("فشل قبول الطلب: " + requestError.message);
            const newUsed = (employee?.used || 0) + Number(request.days || 0);
            const { error: empError } = await supabase.from("employees").update({ used: newUsed }).eq("id", request.employee_id);
            if (empError) alert("تم قبول الطلب لكن فشل تحديث الرصيد: " + empError.message);
            loadAllData();
        }

        async function rejectRequest(id) {
            if (!confirm("هل تريد رفض هذا الطلب؟")) return;
            const { error } = await supabase.from("requests").update({ status: "rejected" }).eq("id", id).eq("status", "pending");
            if (error) return alert("فشل رفض الطلب: " + error.message);
            loadAllData();
        }

        async function resetRequest(id) {
            const request = allRequests.find((r) => String(r.id) === String(id));
            if (!request) return;
            if (!confirm("إرجاع الطلب إلى قيد الانتظار؟")) return;
            if (request.status === "approved") {
                const employee = request.employees;
                const newUsed = Math.max(0, (employee?.used || 0) - Number(request.days || 0));
                const { error: empError } = await supabase.from("employees").update({ used: newUsed }).eq("id", request.employee_id);
                if (empError) return alert("فشل تعديل الرصيد: " + empError.message);
            }
            const { error } = await supabase.from("requests").update({ status: "pending" }).eq("id", id);
            if (error) return alert("فشل إرجاع الطلب: " + error.message);
            loadAllData();
        }

        async function loadAllEmployees() {
            const { data, error } = await supabase.from("employees").select("*").order("name");
            if (error) return alert("فشل تحميل الموظفين: " + error.message);
            allEmployees = data || [];
            renderEmployees();
        }

        function renderEmployees() {
            const container = $("employeesList");
            if (allEmployees.length === 0) {
                container.innerHTML = '<div class="empty">لا يوجد موظفون</div>';
                return;
            }
            container.innerHTML = allEmployees.map((emp) => {
                const remaining = (emp.total_annual || 30) - (emp.used || 0);
                return `
                    <div class="employee-card">
                        <div>
                            <h3>${escapeHtml(emp.name)} ${emp.role === "admin" ? "(مدير)" : ""}</h3>
                            <div class="employee-stats">
                                <span>الرصيد: ${emp.total_annual || 30}</span>
                                <span>المستخدم: ${emp.used || 0}</span>
                                <span class="badge remaining ${remaining < 5 ? "low" : ""}">المتبقي: ${remaining}</span>
                            </div>
                        </div>
                        <div class="actions">
                            ${emp.role !== "admin" ? `
                                <button class="btn btn-warning" data-action="edit-days" data-id="${escapeHtml(emp.id)}">الرصيد</button>
                                <button class="btn btn-danger" data-action="delete-employee" data-id="${escapeHtml(emp.id)}" data-name="${escapeHtml(emp.name)}">حذف</button>
                            ` : ""}
                            <button class="btn btn-info" data-action="emp-password" data-id="${escapeHtml(emp.id)}" data-name="${escapeHtml(emp.name)}" data-username="${escapeHtml(emp.username || "")}" data-has-auth="${emp.auth_user_id ? "yes" : "no"}">كلمة المرور</button>
                        </div>
                    </div>
                `;
            }).join("");
            $("missionEmployee").innerHTML = '<option value="">اختر الموظف</option>' + allEmployees
                .filter((emp) => emp.role !== "admin")
                .map((emp) => `<option value="${escapeHtml(emp.id)}">${escapeHtml(emp.name)}</option>`)
                .join("");
        }

        async function editEmployeeDays(id) {
            const employee = allEmployees.find((emp) => String(emp.id) === String(id));
            const value = prompt("أدخل الرصيد السنوي الجديد:", employee?.total_annual || 30);
            if (value === null) return;
            const total = Number.parseInt(value, 10);
            if (!Number.isFinite(total) || total < 1 || total > 365) return alert("الرجاء إدخال رقم بين 1 و 365");
            const { error } = await supabase.from("employees").update({ total_annual: total }).eq("id", id);
            if (error) return alert("فشل تعديل الرصيد: " + error.message);
            loadAllData();
        }

        async function deleteEmployee(id, name) {
            if (!confirm(`هل أنت متأكد من حذف الموظف "${name}"؟`)) return;
            const hasRequests = allRequests.some((req) => String(req.employee_id) === String(id));
            const hasMissions = allMissions.some((mission) => String(mission.employee_id) === String(id));
            if (hasRequests || hasMissions) return alert("لا يمكن حذف الموظف قبل حذف أو أرشفة طلباته ومأمورياته.");
            const { error } = await supabase.from("employees").delete().eq("id", id);
            if (error) return alert("فشل حذف الموظف: " + error.message);
            loadAllData();
        }

        async function changeEmployeePassword(id, name, username, hasAuth) {
            const password = prompt(`أدخل كلمة المرور الجديدة للموظف "${name}":`);
            if (!password) return;
            if (password.length < 3) return alert("كلمة المرور يجب أن تكون 3 أحرف على الأقل");

            let finalUsername = username;
            if (hasAuth !== "yes" && !finalUsername) {
                finalUsername = prompt(`هذا الموظف قديم وغير مربوط بحساب دخول. أدخل اسم مستخدم إنجليزي له:`);
                if (!finalUsername) return;
                finalUsername = finalUsername.trim().toLowerCase();
            }

            try {
                await invokeAdminFunction(SET_EMPLOYEE_PASSWORD_FUNCTION, {
                    employee_id: id,
                    username: finalUsername,
                    password
                });
            } catch (error) {
                return alert("فشل تغيير كلمة المرور: " + error.message);
            }

            alert("تم تغيير كلمة المرور بنجاح");
            loadAllEmployees();
        }

        async function loadAllMissions() {
            const { data, error } = await supabase
                .from("missions")
                .select("*, employees:employee_id (name)")
                .order("created_at", { ascending: false });
            if (error) return alert("فشل تحميل المأموريات: " + error.message);
            allMissions = data || [];
            renderMissions();
        }

        function renderMissions() {
            const tbody = $("missionsTableBody");
            if (allMissions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty">لا توجد مأموريات</td></tr>';
                return;
            }
            tbody.innerHTML = allMissions.map((m) => `
                <tr>
                    <td>${escapeHtml(m.employees?.name || "غير معروف")}</td>
                    <td>${escapeHtml(m.type)}</td>
                    <td>${escapeHtml(m.start_date)}</td>
                    <td>${escapeHtml(m.end_date)}</td>
                    <td>${escapeHtml(m.description || "-")}</td>
                    <td><span class="badge status-approved">${m.status === "active" ? "نشطة" : "مكتملة"}</span></td>
                    <td><button class="btn btn-danger" data-action="delete-mission" data-id="${escapeHtml(m.id)}">حذف</button></td>
                </tr>
            `).join("");
        }

        async function deleteMission(id) {
            if (!confirm("هل أنت متأكد من حذف هذه المأمورية؟")) return;
            const { error } = await supabase.from("missions").delete().eq("id", id);
            if (error) return alert("فشل حذف المأمورية: " + error.message);
            loadAllMissions();
        }

        function exportToExcel(type) {
            let data = [];
            let fileName = "";
            if (type === "requests") {
                data = getFilteredRequests().map((r) => ({
                    "الموظف": r.employees?.name || "غير معروف",
                    "سنة الإجازة": r.leave_year || new Date(r.start_date).getFullYear(),
                    "نوع الإجازة": r.type,
                    "تاريخ البدء": r.start_date,
                    "عدد الأيام": r.days,
                    "الحالة": statusText[r.status] || r.status
                }));
                fileName = "طلبات_الإجازات.xlsx";
            } else if (type === "employees") {
                data = allEmployees.map((e) => ({
                    "اسم الموظف": e.name,
                    "الصلاحية": e.role === "admin" ? "مدير" : "موظف",
                    "الرصيد السنوي": e.total_annual || 30,
                    "المستخدم": e.used || 0,
                    "المتبقي": (e.total_annual || 30) - (e.used || 0)
                }));
                fileName = "قائمة_الموظفين.xlsx";
            } else {
                data = allMissions.map((m) => ({
                    "الموظف": m.employees?.name || "غير معروف",
                    "النوع": m.type,
                    "تاريخ البدء": m.start_date,
                    "تاريخ الانتهاء": m.end_date,
                    "الوصف": m.description || "-",
                    "الحالة": m.status === "active" ? "نشطة" : "مكتملة"
                }));
                fileName = "المأموريات.xlsx";
            }
            if (data.length === 0) return alert("لا توجد بيانات للتصدير");
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, fileName);
        }

        function exportAllDataToExcel() {
            const requestsData = allRequests.map((r) => ({
                "الموظف": r.employees?.name || "غير معروف",
                "سنة الإجازة": r.leave_year || new Date(r.start_date).getFullYear(),
                "نوع الإجازة": r.type,
                "تاريخ البدء": r.start_date,
                "عدد الأيام": r.days,
                "الحالة": statusText[r.status] || r.status,
                "تاريخ الإنشاء": r.created_at || ""
            }));

            const employeesData = allEmployees.map((e) => ({
                "اسم الموظف": e.name,
                "اسم المستخدم": e.username || "",
                "الصلاحية": e.role === "admin" ? "مدير" : "موظف",
                "الرصيد السنوي": e.total_annual || 30,
                "المستخدم": e.used || 0,
                "المتبقي": (e.total_annual || 30) - (e.used || 0)
            }));

            const missionsData = allMissions.map((m) => ({
                "الموظف": m.employees?.name || "غير معروف",
                "النوع": m.type,
                "تاريخ البدء": m.start_date,
                "تاريخ الانتهاء": m.end_date,
                "الوصف": m.description || "-",
                "الحالة": m.status === "active" ? "نشطة" : "مكتملة",
                "تاريخ الإنشاء": m.created_at || ""
            }));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(requestsData), "طلبات الإجازات");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(employeesData), "الموظفون");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(missionsData), "المأموريات");
            XLSX.writeFile(wb, "كل_بيانات_MMC.xlsx");
        }

        document.querySelector(".tabs").addEventListener("click", (event) => {
            const button = event.target.closest("[data-tab]");
            if (!button) return;
            document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
            button.classList.add("active");
            ["requests", "employees", "missions"].forEach((name) => $(name + "Tab").classList.toggle("active", name === button.dataset.tab));
        });

        ["requestSearch", "yearFilter", "statusFilter", "dateFilter"].forEach((id) => $(id).addEventListener("input", renderRequests));

        $("requestsTableBody").addEventListener("click", (event) => {
            const button = event.target.closest("[data-action]");
            if (!button) return;
            if (button.dataset.action === "approve") approveRequest(button.dataset.id);
            if (button.dataset.action === "reject") rejectRequest(button.dataset.id);
            if (button.dataset.action === "reset") resetRequest(button.dataset.id);
        });

        $("employeesList").addEventListener("click", (event) => {
            const button = event.target.closest("[data-action]");
            if (!button) return;
            if (button.dataset.action === "edit-days") editEmployeeDays(button.dataset.id);
            if (button.dataset.action === "delete-employee") deleteEmployee(button.dataset.id, button.dataset.name);
            if (button.dataset.action === "emp-password") {
                changeEmployeePassword(button.dataset.id, button.dataset.name, button.dataset.username, button.dataset.hasAuth);
            }
        });

        $("missionsTableBody").addEventListener("click", (event) => {
            const button = event.target.closest("[data-action='delete-mission']");
            if (button) deleteMission(button.dataset.id);
        });

        $("addEmployeeForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const name = $("empName").value.trim();
            const username = $("empUsername").value.trim().toLowerCase();
            const password = $("empPassword").value;
            const totalDays = Number.parseInt($("empTotalDays").value, 10) || 30;
            try {
                await invokeAdminFunction(CREATE_EMPLOYEE_FUNCTION, {
                    name,
                    username,
                    password,
                    total_annual: totalDays
                });
            } catch (error) {
                return alert("فشل إضافة الموظف: " + error.message);
            }
            closeModal("addEmployeeModal");
            loadAllEmployees();
        });

        $("addMissionForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const employee_id = $("missionEmployee").value;
            const type = $("missionType").value;
            const start_date = $("missionStartDate").value;
            const end_date = $("missionEndDate").value;
            const description = $("missionDescription").value.trim();
            if (new Date(end_date) < new Date(start_date)) return alert("تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء");
            const { error } = await supabase.from("missions").insert([{ employee_id, type, start_date, end_date, description, status: "active" }]);
            if (error) return alert("فشل إضافة المأمورية: " + error.message);
            closeModal("addMissionModal");
            loadAllMissions();
        });

        $("changePasswordForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const currentPass = $("currentPassword").value;
            const newPass = $("newPassword").value;
            const confirmPass = $("confirmPassword").value;
            if (newPass !== confirmPass) return alert("كلمة المرور الجديدة غير متطابقة");
            const email = `${currentUser.username || currentUser.name}`.trim().toLowerCase() + "@mmc.local";
            const { error: signInError } = await supabase.auth.signInWithPassword({ email, password: currentPass });
            if (signInError) return alert("كلمة المرور الحالية غير صحيحة");
            const { error } = await supabase.auth.updateUser({ password: newPass });
            if (error) return alert("فشل تغيير كلمة المرور: " + error.message);
            closeModal("changePasswordModal");
            alert("تم تغيير كلمة المرور بنجاح");
        });

        document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", () => closeModal(button.dataset.close)));
        $("openChangePassword").addEventListener("click", () => openModal("changePasswordModal"));
        $("openAddEmployee").addEventListener("click", () => openModal("addEmployeeModal"));
        $("openAddMission").addEventListener("click", () => openModal("addMissionModal"));
        $("exportRequests").addEventListener("click", () => exportToExcel("requests"));
        $("exportAllData").addEventListener("click", exportAllDataToExcel);
        $("exportEmployees").addEventListener("click", () => exportToExcel("employees"));
        $("exportMissions").addEventListener("click", () => exportToExcel("missions"));
        $("logoutButton").addEventListener("click", async () => {
            await supabase.auth.signOut();
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        });
        $("themeToggle").addEventListener("click", () => {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            updateThemeIcon(newTheme);
        });

        initTheme();
        checkAuth();
        setInterval(loadAllRequests, 30000);
    </script>
</body>
</html>

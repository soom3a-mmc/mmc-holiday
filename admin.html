<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <title>لوحة المدير - نظام الإجازات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Light Mode */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.08);
            --header-gradient-start: #2c3e50;
            --header-gradient-end: #3498db;
            --card-bg: #ffffff;
            --table-header-bg: #f8f9fa;
            --notification-bg: #e74c3c;
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #888888;
            --border-color: #2a2a4a;
            --input-bg: #0f3460;
            --shadow: rgba(0,0,0,0.3);
            --header-gradient-start: #0f3460;
            --header-gradient-end: #16213e;
            --card-bg: #16213e;
            --table-header-bg: #0f3460;
            --notification-bg: #e74c3c;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--header-gradient-start) 0%, var(--header-gradient-end) 100%);
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .notification-wrapper {
            position: relative;
            margin-left: 10px;
        }

        .notification-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            position: relative;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--notification-bg);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .notification-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 10px 30px var(--shadow);
            width: 350px;
            max-width: 90vw;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        .notification-dropdown.show {
            display: block;
        }

        .notification-item {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            color: var(--text-primary);
        }

        .notification-item:hover {
            background: var(--table-header-bg);
        }

        .notification-item.unread {
            background: rgba(102, 126, 234, 0.1);
        }

        .notification-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .theme-toggle, .logout-btn, .change-password-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            flex-wrap: wrap;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            flex: 0 1 auto;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--header-gradient-start) 0%, var(--header-gradient-end) 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #3498db;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .requests-table, .missions-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }

        .requests-table th, .missions-table th {
            background: var(--table-header-bg);
            padding: 12px;
            text-align: right;
            color: var(--text-primary);
            font-size: 14px;
            white-space: nowrap;
        }

        .requests-table td, .missions-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            white-space: nowrap;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
            white-space: nowrap;
        }

        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }

        .employee-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
        }

        .employee-info h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .employee-stats {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 14px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .remaining-badge {
            background: #d4edda;
            color: #155724;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-right: 5px;
        }

        .remaining-low {
            background: #f8d7da;
            color: #721c24;
        }

        /* تصميم متجاوب للموبايل */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .header-left, .header-right {
                justify-content: center;
            }

            .header-right {
                justify-content: space-around;
            }

            .theme-toggle, .logout-btn, .change-password-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .notification-dropdown {
                width: 300px;
                right: 0;
                left: auto;
            }

            .tabs {
                justify-content: center;
            }

            .tab {
                padding: 8px 15px;
                font-size: 13px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .section {
                padding: 15px;
            }

            .section-title {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn {
                padding: 10px 15px;
                width: 100%;
                margin: 3px 0;
            }

            .action-buttons {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .employee-actions {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 5px;
            }

            .modal-content {
                padding: 20px 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .header-right {
                flex-wrap: wrap;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-value {
                font-size: 28px;
            }

            .employee-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <h1 style="font-size: clamp(18px, 5vw, 24px);">👨‍💼 لوحة تحكم المدير</h1>
            </div>
            <div class="header-right">
                <span id="userName" style="font-size: 14px;"></span>
                
                <!-- نظام الإشعارات -->
                <div class="notification-wrapper">
                    <button class="notification-btn" onclick="toggleNotifications()">
                        🔔
                        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                    </button>
                    <div class="notification-dropdown" id="notificationDropdown">
                        <div style="padding: 15px; text-align: center; color: var(--text-muted);">
                            جاري تحميل الإشعارات...
                        </div>
                    </div>
                </div>
                
                <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
                <button class="change-password-btn" onclick="openChangePasswordModal()">🔐 تغيير كلمة المرور</button>
                <button class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('requests')">📋 طلبات الإجازات</button>
            <button class="tab" onclick="switchTab('employees')">👥 إدارة الموظفين</button>
            <button class="tab" onclick="switchTab('missions')">📋 المأموريات</button>
        </div>

        <!-- تبويب الطلبات -->
        <div id="requestsTab" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">إجمالي الطلبات</div>
                    <div class="stat-value" id="totalRequests">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">معلقة</div>
                    <div class="stat-value" id="pendingRequests">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">مقبولة</div>
                    <div class="stat-value" id="approvedRequests">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">مرفوضة</div>
                    <div class="stat-value" id="rejectedRequests">0</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">
                    <h2>جميع طلبات الإجازات</h2>
                    <button class="btn btn-success" onclick="exportToExcel('requests')">📊 تصدير إلى Excel</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="requests-table">
                        <thead>
                            <tr>
                                <th>الموظف</th>
                                <th>النوع</th>
                                <th>تاريخ البدء</th>
                                <th>الأيام</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- تبويب الموظفين -->
        <div id="employeesTab" class="tab-content">
            <div class="section">
                <div class="section-title">
                    <h2>قائمة الموظفين</h2>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-info" onclick="exportToExcel('employees')">📊 تصدير إلى Excel</button>
                        <button class="btn btn-success" onclick="openAddEmployeeModal()">➕ إضافة موظف</button>
                    </div>
                </div>
                <div id="employeesList"></div>
            </div>
        </div>

        <!-- تبويب المأموريات -->
        <div id="missionsTab" class="tab-content">
            <div class="section">
                <div class="section-title">
                    <h2>إدارة المأموريات</h2>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-info" onclick="exportToExcel('missions')">📊 تصدير إلى Excel</button>
                        <button class="btn btn-success" onclick="openAddMissionModal()">➕ إضافة مأمورية</button>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="missions-table">
                        <thead>
                            <tr>
                                <th>الموظف</th>
                                <th>النوع</th>
                                <th>من</th>
                                <th>إلى</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="missionsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal تغيير كلمة المرور -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--text-primary); margin-bottom: 20px;">🔐 تغيير كلمة المرور</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>كلمة المرور الحالية</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور الجديدة</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">تغيير كلمة المرور</button>
                <button type="button" class="btn btn-danger" onclick="closeChangePasswordModal()" style="width: 100%; margin-top: 10px;">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- Modal إضافة موظف -->
    <div id="addEmployeeModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--text-primary); margin-bottom: 20px;">➕ إضافة موظف جديد</h2>
            <form id="addEmployeeForm">
                <div class="form-group">
                    <label>اسم الموظف</label>
                    <input type="text" id="empName" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="empPassword" required>
                </div>
                <div class="form-group">
                    <label>الرصيد السنوي (أيام)</label>
                    <input type="number" id="empTotalDays" value="30" min="1" max="365">
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">إضافة</button>
                <button type="button" class="btn btn-danger" onclick="closeAddEmployeeModal()" style="width: 100%; margin-top: 10px;">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- Modal إضافة مأمورية -->
    <div id="addMissionModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--text-primary); margin-bottom: 20px;">📋 إضافة مأمورية جديدة</h2>
            <form id="addMissionForm">
                <div class="form-group">
                    <label>الموظف</label>
                    <select id="missionEmployee" required></select>
                </div>
                <div class="form-group">
                    <label>نوع المأمورية</label>
                    <select id="missionType" required>
                        <option value="داخلية">داخلية</option>
                        <option value="خارجية">خارجية</option>
                        <option value="تدريب">تدريب</option>
                        <option value="مؤتمر">مؤتمر</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تاريخ البدء</label>
                    <input type="date" id="missionStartDate" required>
                </div>
                <div class="form-group">
                    <label>تاريخ الانتهاء</label>
                    <input type="date" id="missionEndDate" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="missionDescription" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">إضافة</button>
                <button type="button" class="btn btn-danger" onclick="closeAddMissionModal()" style="width: 100%; margin-top: 10px;">إلغاء</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        let currentUser = null
        let allRequests = []
        let allEmployees = []
        let allMissions = []
        let notifications = []
        let lastRequestCount = 0

        // ============ Dark Mode ============
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light'
            document.documentElement.setAttribute('data-theme', savedTheme)
            updateThemeIcon(savedTheme)
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme')
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark'
            document.documentElement.setAttribute('data-theme', newTheme)
            localStorage.setItem('theme', newTheme)
            updateThemeIcon(newTheme)
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeToggle')
            icon.textContent = theme === 'dark' ? '☀️' : '🌙'
            document.querySelector('meta[name="theme-color"]').content = 
                theme === 'dark' ? '#16213e' : '#2c3e50'
        }

        window.toggleTheme = toggleTheme
        initTheme()

        // ============ نظام الإشعارات ============
        function loadNotifications() {
            const savedNotifications = localStorage.getItem('notifications')
            if (savedNotifications) {
                notifications = JSON.parse(savedNotifications)
            }
            updateNotificationBadge()
            displayNotifications()
        }

        function addNotification(title, message, type = 'request') {
            const notification = {
                id: Date.now(),
                title,
                message,
                type,
                read: false,
                createdAt: new Date().toISOString()
            }
            notifications.unshift(notification)
            // الاحتفاظ بآخر 50 إشعار فقط
            if (notifications.length > 50) {
                notifications = notifications.slice(0, 50)
            }
            localStorage.setItem('notifications', JSON.stringify(notifications))
            updateNotificationBadge()
            displayNotifications()
        }

        function updateNotificationBadge() {
            const unreadCount = notifications.filter(n => !n.read).length
            const badge = document.getElementById('notificationBadge')
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 9 ? '9+' : unreadCount
                badge.style.display = 'flex'
            } else {
                badge.style.display = 'none'
            }
        }

        function displayNotifications() {
            const dropdown = document.getElementById('notificationDropdown')
            const unreadNotifications = notifications.filter(n => !n.read)
            
            if (notifications.length === 0) {
                dropdown.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">لا توجد إشعارات</div>'
                return
            }
            
            dropdown.innerHTML = notifications.slice(0, 20).map(n => `
                <div class="notification-item ${n.read ? '' : 'unread'}" onclick="markNotificationAsRead(${n.id})">
                    <div style="font-weight: 500;">${n.title}</div>
                    <div style="font-size: 14px; margin-top: 5px;">${n.message}</div>
                    <div class="notification-time">${formatTime(n.createdAt)}</div>
                </div>
            `).join('')
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp)
            const now = new Date()
            const diff = now - date
            const minutes = Math.floor(diff / 60000)
            const hours = Math.floor(diff / 3600000)
            const days = Math.floor(diff / 86400000)
            
            if (minutes < 1) return 'الآن'
            if (minutes < 60) return `قبل ${minutes} دقيقة`
            if (hours < 24) return `قبل ${hours} ساعة`
            if (days < 7) return `قبل ${days} يوم`
            return date.toLocaleDateString('ar-SA')
        }

        window.markNotificationAsRead = (id) => {
            const notification = notifications.find(n => n.id === id)
            if (notification) {
                notification.read = true
                localStorage.setItem('notifications', JSON.stringify(notifications))
                updateNotificationBadge()
                displayNotifications()
            }
        }

        window.toggleNotifications = () => {
            const dropdown = document.getElementById('notificationDropdown')
            dropdown.classList.toggle('show')
        }

        // إغلاق الإشعارات عند النقر خارجها
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.notification-wrapper')) {
                document.getElementById('notificationDropdown').classList.remove('show')
            }
        })

        // التحقق من الطلبات الجديدة
        function checkNewRequests(requests) {
            const pendingRequests = requests.filter(r => r.status === 'pending')
            const newCount = pendingRequests.length
            
            if (newCount > lastRequestCount) {
                const diff = newCount - lastRequestCount
                addNotification(
                    '📋 طلبات إجازة جديدة',
                    `لديك ${diff} طلب إجازة ${diff === 1 ? 'جديد' : 'جديدة'} في انتظار الموافقة`,
                    'request'
                )
            }
            
            lastRequestCount = newCount
        }

        // ============ التحقق من الصلاحية ============
        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser')
            if (!savedUser) {
                window.location.href = 'index.html'
                return
            }
            currentUser = JSON.parse(savedUser)
            if (currentUser.role !== 'admin') {
                window.location.href = 'employee.html'
                return
            }
            document.getElementById('userName').textContent = `👨‍💼 ${currentUser.name}`
            loadNotifications()
            loadAllData()
            
            // تحديث الإشعارات كل 30 ثانية
            setInterval(() => {
                loadAllRequests(true)
            }, 30000)
        }

        async function loadAllData() {
            await Promise.all([loadAllRequests(), loadAllEmployees(), loadAllMissions()])
        }

        // ============ تحميل الطلبات ============
        async function loadAllRequests(silent = false) {
            const { data } = await supabase
                .from('requests')
                .select(`*, employees:employee_id (name, total_annual, used)`)
                .order('created_at', { ascending: false })
            
            allRequests = data || []
            
            if (!silent) {
                checkNewRequests(allRequests)
            }
            
            document.getElementById('totalRequests').textContent = allRequests.length
            document.getElementById('pendingRequests').textContent = allRequests.filter(r => r.status === 'pending').length
            document.getElementById('approvedRequests').textContent = allRequests.filter(r => r.status === 'approved').length
            document.getElementById('rejectedRequests').textContent = allRequests.filter(r => r.status === 'rejected').length
            
            const tbody = document.getElementById('requestsTableBody')
            if (allRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">لا توجد طلبات</td></tr>'
                return
            }
            
            tbody.innerHTML = allRequests.map(req => {
                const employee = req.employees || {}
                const remaining = (employee.total_annual || 30) - (employee.used || 0)
                
                return `
                    <tr>
                        <td>
                            ${employee.name || 'غير معروف'}
                            <span class="remaining-badge ${remaining < 5 ? 'remaining-low' : ''}">
                                ${remaining}
                            </span>
                        </td>
                        <td>${req.type}</td>
                        <td>${req.start_date}</td>
                        <td>${req.days}</td>
                        <td><span class="status-badge status-${req.status}">${getStatusText(req.status)}</span></td>
                        <td>
                            <div class="action-buttons">
                                ${req.status === 'pending' ? `
                                    <button class="btn btn-success" onclick="approveRequest('${req.id}')">✅</button>
                                    <button class="btn btn-danger" onclick="rejectRequest('${req.id}')">❌</button>
                                ` : `
                                    <button class="btn btn-warning" onclick="resetRequest('${req.id}')">🔄</button>
                                `}
                            </div>
                        </td>
                    </tr>
                `
            }).join('')
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': '⏳ قيد الانتظار',
                'approved': '✅ مقبول',
                'rejected': '❌ مرفوض'
            }
            return statusMap[status] || status
        }

        window.approveRequest = async (id) => {
            const request = allRequests.find(r => r.id === id)
            if (!request) return
            
            await supabase.from('requests').update({ status: 'approved' }).eq('id', id)
            
            const employee = request.employees
            if (employee) {
                const newUsed = (employee.used || 0) + request.days
                await supabase.from('employees').update({ used: newUsed }).eq('id', request.employee_id)
            }
            
            addNotification('✅ تم قبول الطلب', `تم قبول طلب ${request.employees?.name || 'الموظف'}`, 'approved')
            loadAllData()
        }

        window.rejectRequest = async (id) => {
            await supabase.from('requests').update({ status: 'rejected' }).eq('id', id)
            addNotification('❌ تم رفض الطلب', 'تم رفض طلب الإجازة', 'rejected')
            loadAllData()
        }

        window.resetRequest = async (id) => {
            const request = allRequests.find(r => r.id === id)
            if (!request) return
            
            if (request.status === 'approved') {
                const employee = request.employees
                if (employee) {
                    const newUsed = Math.max(0, (employee.used || 0) - request.days)
                    await supabase.from('employees').update({ used: newUsed }).eq('id', request.employee_id)
                }
            }
            
            await supabase.from('requests').update({ status: 'pending' }).eq('id', id)
            addNotification('🔄 تم إعادة تعيين طلب', 'تم إعادة طلب إلى قيد الانتظار', 'reset')
            loadAllData()
        }

        // ============ تحميل الموظفين ============
        async function loadAllEmployees() {
            const { data } = await supabase.from('employees').select('*').order('name')
            allEmployees = data || []
            
            const container = document.getElementById('employeesList')
            if (allEmployees.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px;">لا يوجد موظفين</div>'
                return
            }
            
            container.innerHTML = allEmployees.map(emp => {
                const remaining = (emp.total_annual || 30) - (emp.used || 0)
                return `
                    <div class="employee-card">
                        <div class="employee-info">
                            <h3>👤 ${emp.name} ${emp.role === 'admin' ? '(مدير)' : ''}</h3>
                            <div class="employee-stats">
                                <span>📊 الإجمالي: ${emp.total_annual || 30}</span>
                                <span>✅ المستخدم: ${emp.used || 0}</span>
                                <span class="remaining-badge ${remaining < 5 ? 'remaining-low' : ''}">
                                    ⏳ المتبقي: ${remaining}
                                </span>
                            </div>
                        </div>
                        <div class="employee-actions">
                            ${emp.role !== 'admin' ? `
                                <button class="btn btn-warning" onclick="editEmployeeDays('${emp.id}')">✏️</button>
                                <button class="btn btn-danger" onclick="deleteEmployee('${emp.id}', '${emp.name}')">🗑️</button>
                            ` : ''}
                            <button class="btn btn-info" onclick="changeEmployeePassword('${emp.id}', '${emp.name}')">🔐</button>
                        </div>
                    </div>
                `
            }).join('')
            
            const missionSelect = document.getElementById('missionEmployee')
            if (missionSelect) {
                missionSelect.innerHTML = '<option value="">اختر الموظف</option>' + 
                    allEmployees.filter(e => e.role !== 'admin').map(e => 
                        `<option value="${e.id}">${e.name}</option>`
                    ).join('')
            }
        }

        window.editEmployeeDays = async (id) => {
            const employee = allEmployees.find(e => e.id === id)
            if (!employee) return
            
            const newTotal = prompt('أدخل الرصيد السنوي الجديد:', employee.total_annual || 30)
            if (newTotal === null) return
            
            const totalDays = parseInt(newTotal)
            if (isNaN(totalDays) || totalDays < 1) {
                alert('الرجاء إدخال رقم صحيح')
                return
            }
            
            await supabase.from('employees').update({ total_annual: totalDays }).eq('id', id)
            loadAllEmployees()
        }

        window.deleteEmployee = async (id, name) => {
            if (!confirm(`هل أنت متأكد من حذف الموظف "${name}"؟`)) return
            
            await supabase.from('employees').delete().eq('id', id)
            loadAllData()
        }

        window.changeEmployeePassword = async (id, name) => {
            const newPassword = prompt(`أدخل كلمة المرور الجديدة للموظف "${name}":`)
            if (!newPassword) return
            
            await supabase.from('employees').update({ password: newPassword }).eq('id', id)
            alert('✅ تم تغيير كلمة المرور بنجاح')
        }

        // ============ تحميل المأموريات ============
        async function loadAllMissions() {
            const { data } = await supabase
                .from('missions')
                .select(`*, employees:employee_id (name)`)
                .order('created_at', { ascending: false })
            
            allMissions = data || []
            
            const tbody = document.getElementById('missionsTableBody')
            if (allMissions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">لا توجد مأموريات</td></tr>'
                return
            }
            
            tbody.innerHTML = allMissions.map(m => {
                return `
                    <tr>
                        <td>${m.employees?.name || 'غير معروف'}</td>
                        <td>${m.type}</td>
                        <td>${m.start_date}</td>
                        <td>${m.end_date}</td>
                        <td><span class="status-badge status-approved">${m.status === 'active' ? '✅ نشطة' : '✅ مكتملة'}</span></td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteMission('${m.id}')">🗑️</button>
                        </td>
                    </tr>
                `
            }).join('')
        }

        window.deleteMission = async (id) => {
            if (!confirm('هل أنت متأكد من حذف هذه المأمورية؟')) return
            await supabase.from('missions').delete().eq('id', id)
            loadAllMissions()
        }

        // ============ تغيير كلمة المرور ============
        window.openChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'flex'
        }

        window.closeChangePasswordModal = () => {
            document.getElementById('changePasswordModal').style.display = 'none'
            document.getElementById('changePasswordForm').reset()
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const currentPass = document.getElementById('currentPassword').value
            const newPass = document.getElementById('newPassword').value
            const confirmPass = document.getElementById('confirmPassword').value
            
            if (currentPass !== currentUser.password) {
                alert('❌ كلمة المرور الحالية غير صحيحة')
                return
            }
            
            if (newPass !== confirmPass) {
                alert('❌ كلمة المرور الجديدة غير متطابقة')
                return
            }
            
            if (newPass.length < 3) {
                alert('❌ كلمة المرور يجب أن تكون 3 أحرف على الأقل')
                return
            }
            
            await supabase.from('employees').update({ password: newPass }).eq('id', currentUser.id)
            
            currentUser.password = newPass
            localStorage.setItem('currentUser', JSON.stringify(currentUser))
            
            alert('✅ تم تغيير كلمة المرور بنجاح')
            closeChangePasswordModal()
        })

        // ============ إضافة موظف ============
        window.openAddEmployeeModal = () => {
            document.getElementById('addEmployeeModal').style.display = 'flex'
        }

        window.closeAddEmployeeModal = () => {
            document.getElementById('addEmployeeModal').style.display = 'none'
            document.getElementById('addEmployeeForm').reset()
        }

        document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const name = document.getElementById('empName').value.trim()
            const password = document.getElementById('empPassword').value
            const totalDays = parseInt(document.getElementById('empTotalDays').value)
            
            if (password.length < 3) {
                alert('❌ كلمة المرور يجب أن تكون 3 أحرف على الأقل')
                return
            }
            
            const { error } = await supabase.from('employees').insert([{
                name, password, total_annual: totalDays, role: 'employee'
            }])
            
            if (error) {
                if (error.message.includes('duplicate')) {
                    alert('❌ اسم المستخدم موجود مسبقاً')
                } else {
                    alert('❌ فشل إضافة الموظف: ' + error.message)
                }
            } else {
                alert('✅ تم إضافة الموظف بنجاح')
                closeAddEmployeeModal()
                loadAllEmployees()
            }
        })

        // ============ إضافة مأمورية ============
        window.openAddMissionModal = () => {
            document.getElementById('addMissionModal').style.display = 'flex'
        }

        window.closeAddMissionModal = () => {
            document.getElementById('addMissionModal').style.display = 'none'
            document.getElementById('addMissionForm').reset()
        }

        document.getElementById('addMissionForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const employee_id = document.getElementById('missionEmployee').value
            const type = document.getElementById('missionType').value
            const start_date = document.getElementById('missionStartDate').value
            const end_date = document.getElementById('missionEndDate').value
            const description = document.getElementById('missionDescription').value
            
            if (!employee_id) {
                alert('❌ الرجاء اختيار الموظف')
                return
            }
            
            if (new Date(end_date) < new Date(start_date)) {
                alert('❌ تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء')
                return
            }
            
            const { error } = await supabase.from('missions').insert([{
                employee_id, type, start_date, end_date, description, status: 'active'
            }])
            
            if (error) {
                alert('❌ فشل إضافة المأمورية: ' + error.message)
            } else {
                alert('✅ تم إضافة المأمورية بنجاح')
                closeAddMissionModal()
                loadAllMissions()
            }
        })

        // ============ التبويبات ============
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            event.target.classList.add('active')
            
            document.getElementById('requestsTab').classList.toggle('active', tabName === 'requests')
            document.getElementById('employeesTab').classList.toggle('active', tabName === 'employees')
            document.getElementById('missionsTab').classList.toggle('active', tabName === 'missions')
        }

        // ============ تصدير Excel ============
        window.exportToExcel = (type) => {
            let data = []
            let fileName = ''
            
            if (type === 'requests') {
                data = allRequests.map(r => ({
                    'الموظف': r.employees?.name || 'غير معروف',
                    'نوع الإجازة': r.type,
                    'تاريخ البدء': r.start_date,
                    'عدد الأيام': r.days,
                    'الحالة': getStatusText(r.status),
                }))
                fileName = 'طلبات_الإجازات.xlsx'
            } else if (type === 'employees') {
                data = allEmployees.map(e => ({
                    'اسم الموظف': e.name,
                    'الصلاحية': e.role === 'admin' ? 'مدير' : 'موظف',
                    'الرصيد السنوي': e.total_annual || 30,
                    'المستخدم': e.used || 0,
                    'المتبقي': (e.total_annual || 30) - (e.used || 0)
                }))
                fileName = 'قائمة_الموظفين.xlsx'
            } else if (type === 'missions') {
                data = allMissions.map(m => ({
                    'الموظف': m.employees?.name || 'غير معروف',
                    'النوع': m.type,
                    'تاريخ البدء': m.start_date,
                    'تاريخ الانتهاء': m.end_date,
                    'الوصف': m.description || '-',
                    'الحالة': m.status === 'active' ? 'نشطة' : 'مكتملة'
                }))
                fileName = 'المأموريات.xlsx'
            }
            
            if (data.length === 0) {
                alert('لا توجد بيانات للتصدير')
                return
            }
            
            const ws = XLSX.utils.json_to_sheet(data)
            const wb = XLSX.utils.book_new()
            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1')
            XLSX.writeFile(wb, fileName)
        }

        // ============ تسجيل الخروج ============
        window.logout = () => {
            localStorage.removeItem('currentUser')
            window.location.href = 'index.html'
        }

        // بدء التطبيق
        checkAuth()
    </script>
</body>
</html>

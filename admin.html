<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المدير - نظام الإجازات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: white;
            padding: 10px;
            border-radius: 15px;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
        }

        .tab.active {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #3498db;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        .requests-table {
            width: 100%;
            border-collapse: collapse;
        }

        .requests-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: right;
        }

        .requests-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 2px;
        }

        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }

        .employee-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>👨‍💼 لوحة تحكم المدير</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="userName"></span>
                <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('requests')">📋 الطلبات</button>
            <button class="tab" onclick="switchTab('employees')">👥 الموظفين</button>
        </div>

        <div id="requestsTab" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">إجمالي الطلبات</div>
                    <div class="stat-value" id="totalRequests">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">معلقة</div>
                    <div class="stat-value" id="pendingRequests">0</div>
                </div>
            </div>

            <div class="section">
                <h2>جميع الطلبات</h2>
                <table class="requests-table">
                    <thead>
                        <tr>
                            <th>الموظف</th>
                            <th>النوع</th>
                            <th>التاريخ</th>
                            <th>الأيام</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="employeesTab" class="tab-content">
            <div class="section">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <h2>قائمة الموظفين</h2>
                    <button class="btn btn-success" onclick="openAddEmployeeModal()">➕ إضافة موظف</button>
                </div>
                <div id="employeesList"></div>
            </div>
        </div>
    </div>

    <div id="addEmployeeModal" class="modal">
        <div class="modal-content">
            <h2>إضافة موظف جديد</h2>
            <form id="addEmployeeForm">
                <div class="form-group">
                    <label>اسم الموظف</label>
                    <input type="text" id="empName" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="empPassword" required>
                </div>
                <div class="form-group">
                    <label>الرصيد السنوي</label>
                    <input type="number" id="empTotalDays" value="30">
                </div>
                <button type="submit" class="btn btn-success">إضافة</button>
                <button type="button" class="btn btn-danger" onclick="closeAddEmployeeModal()">إلغاء</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const SUPABASE_URL = 'https://ueszjhtztdlqaduogzog.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3pqaHR6dGRscWFkdW9nem9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDkxNDksImV4cCI6MjA5MjE4NTE0OX0.euN5Uijw9WXt2aGuk-sNWMMZ78IIiuxVOBBvuzjobxk'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        let currentUser = null
        let allRequests = []
        let allEmployees = []

        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser')
            if (!savedUser) {
                window.location.href = 'index.html'
                return
            }
            currentUser = JSON.parse(savedUser)
            if (currentUser.role !== 'admin') {
                window.location.href = 'employee.html'
                return
            }
            document.getElementById('userName').textContent = `👨‍💼 ${currentUser.name}`
            loadAllData()
        }

        async function loadAllData() {
            await Promise.all([loadAllRequests(), loadAllEmployees()])
        }

        async function loadAllRequests() {
            const { data } = await supabase
                .from('requests')
                .select(`*, employees:employee_id (name)`)
                .order('created_at', { ascending: false })
            
            allRequests = data || []
            document.getElementById('totalRequests').textContent = allRequests.length
            document.getElementById('pendingRequests').textContent = allRequests.filter(r => r.status === 'pending').length
            
            const tbody = document.getElementById('requestsTableBody')
            tbody.innerHTML = allRequests.map(req => `
                <tr>
                    <td>${req.employees?.name || 'غير معروف'}</td>
                    <td>${req.type}</td>
                    <td>${req.start_date}</td>
                    <td>${req.days}</td>
                    <td><span class="status-badge status-${req.status}">${req.status}</span></td>
                    <td>
                        ${req.status === 'pending' ? `
                            <button class="btn btn-success" onclick="approveRequest('${req.id}')">قبول</button>
                            <button class="btn btn-danger" onclick="rejectRequest('${req.id}')">رفض</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('')
        }

        async function loadAllEmployees() {
            const { data } = await supabase.from('employees').select('*').order('name')
            allEmployees = data || []
            
            document.getElementById('employeesList').innerHTML = allEmployees.map(emp => `
                <div class="employee-card">
                    <div>
                        <h3>👤 ${emp.name}</h3>
                        <div>الإجمالي: ${emp.total_annual || 30} | المستخدم: ${emp.used || 0}</div>
                    </div>
                </div>
            `).join('')
        }

        window.approveRequest = async (id) => {
            const request = allRequests.find(r => r.id === id)
            await supabase.from('requests').update({ status: 'approved' }).eq('id', id)
            await supabase.from('employees').update({ used: (request.employees?.used || 0) + request.days }).eq('id', request.employee_id)
            loadAllData()
        }

        window.rejectRequest = async (id) => {
            await supabase.from('requests').update({ status: 'rejected' }).eq('id', id)
            loadAllData()
        }

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            event.target.classList.add('active')
            document.getElementById('requestsTab').classList.toggle('active', tab === 'requests')
            document.getElementById('employeesTab').classList.toggle('active', tab === 'employees')
        }

        window.openAddEmployeeModal = () => document.getElementById('addEmployeeModal').style.display = 'flex'
        window.closeAddEmployeeModal = () => document.getElementById('addEmployeeModal').style.display = 'none'

        document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const name = document.getElementById('empName').value
            const password = document.getElementById('empPassword').value
            const total_annual = parseInt(document.getElementById('empTotalDays').value)
            
            await supabase.from('employees').insert([{ name, password, total_annual }])
            alert('✅ تم إضافة الموظف')
            closeAddEmployeeModal()
            loadAllEmployees()
        })

        window.logout = () => {
            localStorage.removeItem('currentUser')
            window.location.href = 'index.html'
        }

        checkAuth()
    </script>
</body>
</html>
